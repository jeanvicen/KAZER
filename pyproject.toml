[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kazer"
version = "0.1.0"
description = "Fundação modular e segura para um agente de IA extensível."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "starlette>=1.0,<2",
    "uvicorn>=0.30,<1",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2", "httpx2>=2,<3"]

[project.scripts]
kazer = "kazer.main:main"

[tool.setuptools.packages.find]
include = ["kazer*"]

# Vercel: o preset "python" (vercel.json) carrega esta app ASGI como função.
[tool.vercel]
entrypoint = "kazer.interfaces.web.asgi:app"

[tool.setuptools.package-data]
"kazer.interfaces.web" = [
    "static/*.html",
    "static/*.webmanifest",
    "static/assets/*",
    "static/assets/brand/*",
    "static/assets/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
