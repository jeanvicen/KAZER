<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050507" />
  <meta name="color-scheme" content="dark" />
  <title>KAZER</title>

  <link rel="icon" href="../download/assets/kazer-login-symbol.png" type="image/png" />
  <link rel="apple-touch-icon" href="../download/assets/kazer-login-symbol.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #050507;
      --card: rgba(14, 14, 18, .78);
      --card-strong: rgba(18, 18, 23, .92);
      --line: rgba(255,255,255,.09);
      --line-focus: rgba(139,111,255,.85);
      --text: #f6f6f8;
      --muted: rgba(246,246,248,.50);
      --faint: rgba(246,246,248,.28);
      --purple: #6c4cf1;
      --purple-2: #8b6fff;
      --green: #2ed573;
      --red: #ff6b6b;
      --orange: #ffb454;
      --yellow: #ffd86b;
      --radius: 24px;
      --radius-field: 14px;
      --vh: 1vh;
      --ease: cubic-bezier(.2,.8,.2,1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      position: fixed;
      inset: 0;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overscroll-behavior: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      appearance: none;
      border: 0;
      outline: 0;
    }

    /* ================= BACKGROUND ================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(108,76,241,.07), transparent 28%),
        radial-gradient(circle at 8% 95%, rgba(255,255,255,.025), transparent 24%),
        radial-gradient(circle at 96% 5%, rgba(255,255,255,.02), transparent 22%),
        #050507;
    }

    #lineBackground {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .52;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 25%, rgba(5,5,7,.1) 58%, rgba(5,5,7,.52) 100%);
    }

    /* ================= SPLASH ================= */

    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #050507;
      opacity: 1;
      visibility: visible;
      transition: opacity .7s var(--ease), visibility .7s;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .splash-icon {
      position: relative;
      width: 64px;
      height: 64px;
      margin-bottom: 15px;
    }

    .splash-icon::after {
      content: "";
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,111,255,.13), transparent 68%);
      filter: blur(8px);
      animation: glow 2.8s ease-in-out infinite;
    }

    .splash-icon img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: brightness(1.07);
    }

    #splashWord {
      width: min(300px, 68vw);
      height: auto;
      display: block;
    }

    .splash-caption {
      margin-top: 8px;
      color: rgba(255,255,255,.30);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .24em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn .8s ease .4s forwards;
    }

    .splash-line {
      width: 120px;
      height: 1px;
      margin-top: 24px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
    }

    .splash-line::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: var(--purple-2);
      transform: translateX(-110%);
      animation: sweep 1.5s ease-in-out infinite;
    }

    /* ================= AUTH ================= */

    #login {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .65s var(--ease), visibility .65s;
    }

    #login.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .auth-wrap {
      width: min(430px, 100%);
      max-height: calc(100vh - 26px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Small brand at top */
    .top-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      color: rgba(255,255,255,.44);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(8px);
    }

    #login.visible .top-brand {
      animation: up .7s var(--ease) .05s forwards;
    }

    .top-brand img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      filter: brightness(1.05);
    }

    .auth-card {
      position: relative;
      width: 100%;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(18,18,23,.88), rgba(10,10,13,.90));
      box-shadow:
        0 28px 80px rgba(0,0,0,.42),
        inset 0 1px 0 rgba(255,255,255,.045);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      overflow: hidden;
      opacity: 0;
      transform: translateY(16px);
    }

    #login.visible .auth-card {
      animation: cardIn .75s var(--ease) .1s forwards;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(139,111,255,.66), transparent);
    }

    .card-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .card-logo {
      width: 42px;
      height: 42px;
      margin: 0 auto 17px;
      object-fit: contain;
      filter: drop-shadow(0 0 14px rgba(139,111,255,.12));
      animation: float 3.4s ease-in-out infinite;
    }

    .auth-title {
      font-size: 28px;
      line-height: 1.02;
      letter-spacing: -.045em;
      font-weight: 700;
    }

    .auth-subtitle {
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    /* tiny context line: one useful piece of information only */
    .context-line {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 13px;
      color: var(--faint);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .context-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(46,213,115,.06);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-wrap {
      position: relative;
      animation: fieldIn .4s var(--ease) both;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 56px;
      padding: 0 15px;
      border: 1px solid rgba(255,255,255,.085);
      border-radius: var(--radius-field);
      background: rgba(0,0,0,.18);
      transition:
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s var(--ease),
        transform .25s var(--ease);
    }

    .field:hover {
      background: rgba(255,255,255,.018);
      border-color: rgba(255,255,255,.12);
    }

    .field:focus-within {
      border-color: var(--line-focus);
      background: rgba(108,76,241,.04);
      box-shadow:
        0 0 0 4px rgba(108,76,241,.15),
        0 10px 30px rgba(0,0,0,.12);
      transform: translateY(-1px);
    }

    .field svg {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      color: rgba(255,255,255,.36);
      transition: color .25s ease, opacity .25s ease;
    }

    .field:focus-within svg {
      color: var(--purple-3);
    }

    .field input {
      width: 100%;
      min-width: 0;
      height: 54px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
    }

    .field input::placeholder {
      color: rgba(246,246,248,.30);
    }

    .field input:-webkit-autofill,
    .field input:-webkit-autofill:hover,
    .field input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      box-shadow: 0 0 0 1000px rgba(0,0,0,.16) inset;
      transition: background-color 9999s ease-in-out 0s;
    }

    .eye {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: rgba(255,255,255,.43);
      background: transparent;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, transform .18s ease;
    }

    .eye:hover {
      color: #fff;
      background: rgba(255,255,255,.05);
    }

    .eye:active {
      transform: scale(.94);
    }

    .eye-pupil {
      transform-origin: center;
      transform-box: fill-box;
      transition: transform .28s cubic-bezier(.5,0,.5,1), opacity .18s ease;
    }

    .eye-outline {
      transform-origin: center;
      transform-box: fill-box;
      transition: transform .28s cubic-bezier(.5,0,.5,1);
    }

    .eye.closed .eye-pupil {
      transform: scaleY(.05);
      opacity: 0;
    }

    .eye.closed .eye-outline {
      transform: scaleY(.12);
    }

    /* Signup only */
    .signup-only {
      display: none;
    }

    body.mode-signup .signup-only {
      display: flex;
    }

    body.mode-signup .password-note {
      display: block;
    }

    /* Strength */
    .strength {
      display: none;
      flex-direction: column;
      gap: 7px;
      padding: 2px 1px 0;
    }

    body.mode-signup .strength.show {
      display: flex;
    }

    .strength-track {
      height: 4px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
    }

    .strength-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--red);
      transition: width .42s cubic-bezier(.4,0,.2,1), background-color .3s ease;
    }

    .strength-fill.pulse {
      animation: strengthPulse .42s ease;
    }

    .strength-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 14px;
    }

    .strength-text,
    .strength-score {
      font-size: 10px;
      font-weight: 600;
    }

    .strength-text {
      color: var(--muted);
    }

    .strength-score {
      color: rgba(255,255,255,.22);
    }

    .password-note {
      display: none;
      margin-top: -2px;
      padding: 0 2px;
      color: var(--faint);
      font-size: 10px;
      line-height: 1.5;
    }

    /* Error */
    .error {
      min-height: 18px;
      padding: 2px;
      color: var(--red);
      font-size: 12px;
      line-height: 1.45;
    }

    .shake {
      animation: shake .4s cubic-bezier(.36,.07,.19,.97);
    }

    /* CTA */
    .primary {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      width: 100%;
      min-height: 56px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,.10);
      color: #fff;
      background: linear-gradient(135deg, var(--purple-2), var(--purple));
      box-shadow:
        0 9px 24px rgba(108,76,241,.25),
        inset 0 1px 0 rgba(255,255,255,.20);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, filter .2s ease, box-shadow .2s ease, opacity .2s ease;
    }

    .primary::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,.15) 48%, transparent 74%);
      transform: translateX(-100%);
      transition: transform .7s ease;
    }

    .primary:hover:not(:disabled) {
      filter: brightness(1.045);
      box-shadow:
        0 12px 30px rgba(108,76,241,.29),
        inset 0 1px 0 rgba(255,255,255,.22);
    }

    .primary:hover:not(:disabled)::after {
      transform: translateX(100%);
    }

    .primary:active:not(:disabled) {
      transform: scale(.987);
    }

    .primary:disabled {
      opacity: .58;
      cursor: not-allowed;
    }

    .button-text {
      transition: opacity .15s ease;
    }

    .spinner {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 21px;
      height: 21px;
      margin: -10.5px 0 0 -10.5px;
      display: none;
      border: 2px solid rgba(255,255,255,.28);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .primary.loading .button-text {
      opacity: 0;
    }

    .primary.loading .spinner {
      display: block;
    }

    /* Switch */
    .switch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 11px;
    }

    .switch a {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,.28);
      transition: opacity .18s ease, border-color .18s ease;
    }

    .switch a:hover {
      opacity: .82;
      border-color: #fff;
    }

    .mini-footer {
      margin-top: 14px;
      color: rgba(255,255,255,.22);
      font-size: 9px;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    /* ================= ANIMATIONS ================= */

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fieldIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      0%, 100% { opacity: .45; transform: scale(.98); }
      50% { opacity: .9; transform: scale(1.05); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes sweep {
      0% { transform: translateX(-110%); }
      50%, 100% { transform: translateX(250%); }
    }

    @keyframes strengthPulse {
      0% { transform: scaleY(1); }
      45% { transform: scaleY(1.6); }
      100% { transform: scaleY(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      16% { transform: translateX(-3px); }
      32% { transform: translateX(3px); }
      48% { transform: translateX(-3px); }
      64% { transform: translateX(3px); }
      80% { transform: translateX(-2px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 480px) {
      #login {
        align-items: flex-start;
      }

      .auth-wrap {
        width: 100%;
        padding-top: 4vh;
        max-height: calc(100vh - 10px);
      }

      .top-brand {
        margin-bottom: 14px;
      }

      .auth-card {
        padding: 24px 17px 18px;
        border-radius: 21px;
      }

      .card-header {
        margin-bottom: 21px;
      }

      .card-logo {
        width: 38px;
        height: 38px;
        margin-bottom: 14px;
      }

      .auth-title {
        font-size: 25px;
      }

      .auth-subtitle {
        font-size: 12px;
      }

      .mini-footer {
        display: none;
      }
    }

    @media (max-height: 700px) {
      .auth-card {
        padding-top: 22px;
        padding-bottom: 17px;
      }

      .card-header {
        margin-bottom: 19px;
      }

      .field {
        min-height: 52px;
      }

      .field input {
        height: 50px;
      }

      .primary {
        min-height: 52px;
      }

      .switch {
        margin-top: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }

      #lineBackground {
        opacity: .45;
      }
    }

    :focus-visible {
      outline: 2px solid var(--purple-2);
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true">
    <canvas id="lineBackground"></canvas>
  </div>

  <section id="splash" aria-label="Kazer">
    <div class="splash-content">
      <div class="splash-icon">
        <img src="../download/assets/kazer-login-symbol.png" alt="" />
      </div>
      <canvas id="splashWord" width="600" height="110"></canvas>
      <div class="splash-caption">Klipza Studio</div>
      <div class="splash-line"></div>
    </div>
  </section>

  <main id="login" aria-labelledby="authTitle">
    <div class="auth-wrap">
      <div class="top-brand">
        <img src="../download/assets/kazer-login-symbol.png" alt="" />
        <span>KAZER</span>
      </div>

      <section class="auth-card" id="authCard">
        <div class="card-header">
          <img class="card-logo" src="../download/assets/kazer-login-symbol.png" alt="" />

          <h1 class="auth-title" id="authTitle">Entrar para continuar</h1>

          <p class="auth-subtitle" id="subText">
            Acesse sua conta Kazer.
          </p>

          <div class="context-line">
            <span class="context-dot"></span>
            <span>Conexão segura</span>
          </div>
        </div>

        <form id="authForm" novalidate>
          <div class="field-wrap signup-only">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
              </svg>
              <input
                type="text"
                id="displayName"
                placeholder="Como devemos te chamar?"
                autocomplete="name"
                maxlength="80"
                spellcheck="false"
              />
            </div>
          </div>

          <div class="field-wrap">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M3 6l9 7 9-7"/>
                <rect x="3" y="5" width="18" height="14" rx="2"/>
              </svg>
              <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                required
                autocomplete="email"
                maxlength="254"
                inputmode="email"
              />
            </div>
          </div>

          <div class="field-wrap">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="5" y="11" width="14" height="9" rx="2"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              </svg>

              <input
                type="password"
                id="password"
                placeholder="Sua senha"
                required
                autocomplete="current-password"
                minlength="10"
                maxlength="256"
              />

              <button type="button" class="eye" id="eyeBtnPassword" aria-label="Mostrar senha">
                <svg id="eyeIconPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path class="eye-outline" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle class="eye-pupil" cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="strength" id="strengthWrap">
            <div class="strength-track">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-row">
              <span class="strength-text" id="strengthText">Digite uma senha</span>
              <span class="strength-score" id="strengthScore"></span>
            </div>
          </div>

          <div class="password-note signup-only" id="passwordHint">
            Pelo menos 10 caracteres, 1 letra maiúscula e 1 caractere especial.
          </div>

          <div class="field-wrap signup-only">
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="5" y="11" width="14" height="9" rx="2"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              </svg>

              <input
                type="password"
                id="confirmPassword"
                placeholder="Digite a senha novamente"
                autocomplete="new-password"
                minlength="10"
                maxlength="256"
              />

              <button type="button" class="eye" id="eyeBtnConfirmPassword" aria-label="Mostrar senha">
                <svg id="eyeIconConfirmPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path class="eye-outline" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle class="eye-pupil" cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="error" id="errorMsg" aria-live="polite"></div>

          <button type="submit" class="primary" id="submitBtn">
            <span class="button-text" id="buttonText">Sign in</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <div class="switch">
          <span id="switchText">Não tem conta?</span>
          <a href="#signup" id="switchLink">Criar conta</a>
        </div>

        <div class="mini-footer">Klipza Studio</div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (() => {
      "use strict";

      /* =========================================================
         VIEWPORT
      ========================================================= */
      function setVH() {
        document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px");
      }
      setVH();
      window.addEventListener("resize", setVH, { passive: true });
      window.addEventListener("orientationchange", setVH, { passive: true });

      /* =========================================================
         LINE BACKGROUND
      ========================================================= */
      (() => {
        const canvas = document.getElementById("lineBackground");
        const ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return;

        let w = 0;
        let h = 0;
        let dpr = 1;

        function resize() {
          dpr = Math.min(2, window.devicePixelRatio || 1);
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          canvas.style.width = w + "px";
          canvas.style.height = h + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function draw(t) {
          const time = t * 0.00033;

          ctx.fillStyle = "#050507";
          ctx.fillRect(0, 0, w, h);

          const cols = Math.max(16, Math.min(29, Math.floor(w / 58)));
          const rows = Math.max(12, Math.min(21, Math.floor(h / 51)));
          const sx = w / Math.max(1, cols - 1);
          const sy = h / Math.max(1, rows - 1);

          for (let y = -1; y <= rows + 1; y++) {
            ctx.beginPath();

            for (let x = -2; x <= cols + 2; x++) {
              const px = x * sx;
              const py =
                y * sy +
                Math.sin(x * .46 + time * 1.45 + y * .14) * 8 +
                Math.sin(x * .18 - time + y * .28) * 4;

              if (x === -2) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }

            ctx.strokeStyle = "rgba(255,255,255,.034)";
            ctx.lineWidth = .7;
            ctx.stroke();
          }

          for (let x = -1; x <= cols + 1; x++) {
            ctx.beginPath();

            for (let y = -2; y <= rows + 2; y++) {
              const px =
                x * sx +
                Math.sin(y * .50 - time * 1.12 + x * .19) * 5 +
                Math.sin(y * .20 + time * 1.1 + x * .21) * 3;

              const py = y * sy;

              if (y === -2) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }

            ctx.strokeStyle = "rgba(139,111,255,.016)";
            ctx.lineWidth = .55;
            ctx.stroke();
          }

          requestAnimationFrame(draw);
        }

        resize();
        window.addEventListener("resize", resize, { passive: true });
        requestAnimationFrame(draw);
      })();

      /* =========================================================
         METALLIC KAZER
      ========================================================= */
      function initKazerWordmark(canvas) {
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const W = canvas.width;
        const H = canvas.height;

        const draw = (t) => {
          ctx.clearRect(0, 0, W, H);
          ctx.save();

          const size = Math.floor(H * .73);
          ctx.font = `${size}px "Cinzel", serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          const shift = (t * .00014) % 1;

          const grad = ctx.createLinearGradient(
            W * (-.5 + shift),
            0,
            W * (1 + shift),
            0
          );

          grad.addColorStop(0, "#51525b");
          grad.addColorStop(.18, "#e1e2e8");
          grad.addColorStop(.32, "#a49bff");
          grad.addColorStop(.46, "#ffffff");
          grad.addColorStop(.59, "#6e6b9e");
          grad.addColorStop(.76, "#ececf0");
          grad.addColorStop(1, "#50515a");

          ctx.fillStyle = grad;
          ctx.shadowColor = "rgba(139,111,255,.13)";
          ctx.shadowBlur = 11;
          ctx.fillText("KAZER", W / 2, H / 2 + 2);

          const sheen = ctx.createLinearGradient(0, 0, 0, H);
          sheen.addColorStop(0, "rgba(255,255,255,.26)");
          sheen.addColorStop(.48, "rgba(255,255,255,0)");
          sheen.addColorStop(1, "rgba(0,0,0,.18)");

          ctx.globalCompositeOperation = "source-atop";
          ctx.fillStyle = sheen;
          ctx.fillRect(0, 0, W, H);

          ctx.restore();
          requestAnimationFrame(draw);
        };

        const start = () => requestAnimationFrame(draw);

        if (document.fonts?.load) {
          document.fonts.load('90px "Cinzel"').catch(() => {}).finally(start);
        } else {
          setTimeout(start, 200);
        }
      }

      initKazerWordmark(document.getElementById("splashWord"));

      /* =========================================================
         ELEMENTS
      ========================================================= */
      const splash = document.getElementById("splash");
      const login = document.getElementById("login");
      const authCard = document.getElementById("authCard");

      const authForm = document.getElementById("authForm");
      const authTitle = document.getElementById("authTitle");
      const subText = document.getElementById("subText");
      const buttonText = document.getElementById("buttonText");
      const submitBtn = document.getElementById("submitBtn");
      const switchText = document.getElementById("switchText");
      const switchLink = document.getElementById("switchLink");
      const errorMsg = document.getElementById("errorMsg");

      const displayName = document.getElementById("displayName");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirmPassword");

      const strength = document.getElementById("strengthWrap");
      const strengthFill = document.getElementById("strengthFill");
      const strengthText = document.getElementById("strengthText");
      const strengthScore = document.getElementById("strengthScore");

      let isSignup = false;

      /* =========================================================
         PASSWORD EYE
      ========================================================= */
      function togglePassword(id) {
        const input = document.getElementById(id);
        const suffix = id.charAt(0).toUpperCase() + id.slice(1);
        const button = document.getElementById("eyeBtn" + suffix);
        const icon = document.getElementById("eyeIcon" + suffix);

        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        icon.classList.toggle("closed", hidden);
        button.setAttribute("aria-label", hidden ? "Ocultar senha" : "Mostrar senha");
      }

      document.getElementById("eyeBtnPassword").addEventListener("click", () => togglePassword("password"));
      document.getElementById("eyeBtnConfirmPassword").addEventListener("click", () => togglePassword("confirmPassword"));

      /* =========================================================
         MODE
      ========================================================= */
      function clearError() {
        errorMsg.textContent = "";
        errorMsg.removeAttribute("data-type");
        authCard.classList.remove("shake");
      }

      function setMode(signup) {
        isSignup = signup;
        document.body.classList.toggle("mode-signup", signup);

        if (signup) {
          authTitle.textContent = "Criar sua conta";
          subText.textContent = "Seu espaço começa aqui.";
          switchText.textContent = "Já tem conta?";
          switchLink.textContent = "Entrar";

          displayName.setAttribute("required", "true");
          confirmPassword.setAttribute("required", "true");
          password.setAttribute("autocomplete", "new-password");
        } else {
          authTitle.textContent = "Entrar para continuar";
          subText.textContent = "Acesse sua conta Kazer.";
          switchText.textContent = "Não tem conta?";
          switchLink.textContent = "Criar conta";

          displayName.removeAttribute("required");
          confirmPassword.removeAttribute("required");
          password.setAttribute("autocomplete", "current-password");

          strength.classList.remove("show");
          strengthFill.style.width = "0%";
        }

        buttonText.textContent = signup ? "Criar conta" : "Sign in";
        clearError();

        window.history.replaceState(null, "", signup ? "#signup" : "#login");

        requestAnimationFrame(() => {
          (signup ? displayName : email).focus({ preventScroll: true });
        });
      }

      switchLink.addEventListener("click", (event) => {
        event.preventDefault();

        authCard.classList.remove("shake");
        authCard.style.transform = "scale(.995)";
        setTimeout(() => {
          authCard.style.transform = "";
          setMode(!isSignup);
        }, 80);
      });

      /* =========================================================
         PASSWORD STRENGTH
      ========================================================= */
      const config = {
        0: { pct: 3, color: "var(--red)", text: "Digite uma senha", score: "" },
        1: { pct: 25, color: "var(--red)", text: "Senha fraca — capriche mais", score: "1/4" },
        2: { pct: 50, color: "var(--orange)", text: "Quase lá, dá pra melhorar", score: "2/4" },
        3: { pct: 75, color: "var(--yellow)", text: "Boa senha!", score: "3/4" },
        4: { pct: 100, color: "var(--green)", text: "Senha forte, mandou bem!", score: "4/4" }
      };

      function getPasswordStrength(value) {
        if (!value) return 0;

        let score = 0;
        if (value.length >= 6) score++;
        if (value.length >= 10) score++;
        if (/[A-Z]/.test(value)) score++;
        if (/[^A-Za-z0-9]/.test(value)) score++;
        if (/[0-9]/.test(value)) score++;

        if (value.length < 6) score = Math.min(score, 1);
        return Math.min(score, 4);
      }

      function validPassword(value) {
        return (
          value.length >= 10 &&
          value.length <= 256 &&
          /[A-Z]/.test(value) &&
          /[^A-Za-z0-9]/.test(value)
        );
      }

      function updateStrength(value) {
        if (!value) {
          strength.classList.remove("show");
          return;
        }

        strength.classList.add("show");

        const level = getPasswordStrength(value);
        const item = config[level];

        strengthFill.style.width = item.pct + "%";
        strengthFill.style.backgroundColor = item.color;
        strengthText.style.color = item.color;
        strengthText.textContent = item.text;
        strengthScore.textContent = item.score;

        strengthFill.classList.remove("pulse");
        void strengthFill.offsetWidth;
        strengthFill.classList.add("pulse");
      }

      password.addEventListener("input", () => {
        if (isSignup) updateStrength(password.value);
        checkMatch();
      });

      function checkMatch() {
        if (!isSignup) return;

        if (!confirmPassword.value) {
          if (errorMsg.dataset.type === "mismatch") clearError();
          return;
        }

        if (password.value !== confirmPassword.value) {
          errorMsg.textContent = "Acho que a senha de confirmação não ficou igual à primeira.";
          errorMsg.dataset.type = "mismatch";
        } else if (errorMsg.dataset.type === "mismatch") {
          clearError();
        }
      }

      confirmPassword.addEventListener("input", checkMatch);

      /* =========================================================
         SUPABASE — MANTIDO
      ========================================================= */
      const KAZER_SUPABASE_URL = "https://mqjunopzycdezzjmlhip.supabase.co";
      const KAZER_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xanVub3B6eWNkZXp6am1saGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4Mzg3NDksImV4cCI6MjEwMzQxNDc0OX0.Y_o2_QQhZzuCjvHdEfxaR5VrAxo7NFenPaDmdHN3bwM";

      const kazerSupabase = window.supabase?.createClient(
        KAZER_SUPABASE_URL,
        KAZER_SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false
          }
        }
      );

      function authErrorMessage(error) {
        const msg = String(error?.message || "").toLowerCase();

        if (msg.includes("invalid login credentials")) {
          return "E-mail ou senha incorretos. Que tal verificar o Caps Lock?";
        }

        if (msg.includes("email not confirmed")) {
          return "O acesso por e-mail ainda não está liberado no projeto Kazer.";
        }

        if (msg.includes("user already registered")) {
          return "Este e-mail já tem uma conta. Vamos entrar?";
        }

        if (msg.includes("password")) {
          return "Sua senha ainda tá fraca — use pelo menos 10 caracteres, 1 letra maiúscula e 1 caractere especial.";
        }

        return "Não foi possível concluir agora. Tente novamente.";
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.classList.toggle("loading", loading);
      }

      authForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearError();

        if (!kazerSupabase) {
          errorMsg.textContent = "A conexão segura do Kazer não carregou. Atualize a página.";
          return;
        }

        const name = displayName.value.trim();
        const mail = email.value.trim();
        const pass = password.value;
        const confirm = confirmPassword.value;

        if (!mail) {
          errorMsg.textContent = "Digite seu e-mail para continuar.";
          email.focus();
          return;
        }

        if (!pass) {
          errorMsg.textContent = "Digite sua senha para continuar.";
          password.focus();
          return;
        }

        if (isSignup) {
          if (!name || name.length > 80) {
            errorMsg.textContent = "Informe um nome válido de até 80 caracteres.";
            displayName.focus();
            return;
          }

          if (!validPassword(pass)) {
            errorMsg.textContent =
              "Sua senha ainda tá fraca — use pelo menos 10 caracteres, 1 letra maiúscula e 1 caractere especial.";
            password.focus();
            return;
          }

          if (pass !== confirm) {
            errorMsg.textContent = "Acho que a senha de confirmação não ficou igual à primeira.";
            confirmPassword.focus();
            return;
          }
        }

        setLoading(true);

        try {
          const result = isSignup
            ? await kazerSupabase.auth.signUp({
                email: mail,
                password: pass,
                options: {
                  data: { display_name: name },
                  emailRedirectTo: `${window.location.origin}/chat`
                }
              })
            : await kazerSupabase.auth.signInWithPassword({
                email: mail,
                password: pass
              });

          if (result.error) throw result.error;

          if (!result.data.session) {
            throw new Error("A sessão imediata ainda não está habilitada no projeto Kazer.");
          }

          if (isSignup && result.data.user?.id) {
            try {
              await kazerSupabase
                .from("profiles")
                .update({ display_name: name })
                .eq("id", result.data.user.id);
            } catch (_) {}
          }

          try {
            await kazerSupabase.rpc("touch_user_activity");
          } catch (_) {}

          window.location.assign("/chat");
        } catch (error) {
          errorMsg.textContent = authErrorMessage(error);

          authCard.classList.remove("shake");
          void authCard.offsetWidth;
          authCard.classList.add("shake");

          setLoading(false);
        }
      });

      /* =========================================================
         BOOT / SESSION
      ========================================================= */
      window.addEventListener("load", async () => {
        let session = null;

        try {
          const result = await kazerSupabase?.auth.getSession();
          session = result?.data?.session || null;
        } catch (_) {
          session = null;
        }

        if (session) {
          setTimeout(() => {
            window.location.assign("/chat");
          }, 1500);
          return;
        }

        setTimeout(() => {
          splash.classList.add("hidden");

          setTimeout(() => {
            login.classList.add("visible");

            if (window.location.hash === "#signup") {
              setMode(true);
            } else {
              setMode(false);
            }
          }, 700);
        }, 2500);
      });
    })();
  </script>
</body>
</html>
