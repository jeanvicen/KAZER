<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<title>KAZER</title>
<link rel="icon" href="../download/assets/kazer-login-symbol.png" type="image/png">
<link rel="apple-touch-icon" href="../download/assets/kazer-login-symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
  :root {
    --purple: #6C4CF1;
    --purple-2: #8B6FFF;
    --purple-glow: rgba(108, 76, 241, 0.25);
    --bg: #050508;
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.5);
    --border: rgba(255, 255, 255, 0.1);
    --glass: rgba(255, 255, 255, 0.03);
    --vh: 1vh;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #1a1533 0%, var(--bg) 60%);
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
  }

  body {
    height: calc(var(--vh, 1vh) * 100);
    width: 100%;
    position: fixed;
    inset: 0;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  #splash {
    z-index: 20;
    background: var(--bg);
    transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .brand-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 0;
    transform: scale(0.94);
    animation: brandIn 0.8s cubic-bezier(0.2, 0.9, 0.25, 1) forwards;
  }

  @keyframes brandIn {
    to { opacity: 1; transform: scale(1); }
  }

  .star-wrap {
    width: clamp(48px, 12vw, 64px);
    height: clamp(48px, 12vw, 64px);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .star {
    width: 100%;
    height: 100%;
    display: block;
    background: url("../download/assets/kazer-login-symbol.png") center / contain no-repeat;
    animation: starPulse 3s ease-in-out infinite;
  }

  @keyframes starPulse {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 8px rgba(108, 76, 241, 0.3)); }
    50% { filter: brightness(1.2) drop-shadow(0 0 16px rgba(108, 76, 241, 0.6)); }
  }

  .kazer-canvas-container {
    width: min(60vw, 280px);
    height: clamp(60px, 16vw, 90px);
    display: block;
  }

  .kazer-canvas-container canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
  }

  .footer-brand {
    position: absolute;
    bottom: clamp(32px, 8vh, 56px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    padding: 0 24px;
  }

  .footer-brand span {
    font-size: clamp(11px, 3vw, 13px);
    font-weight: 600;
    letter-spacing: clamp(3px, 1.2vw, 5px);
    color: var(--text-dim);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1s ease 0.5s forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #login {
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    padding: max(env(safe-area-inset-top), 32px) 24px max(env(safe-area-inset-bottom), 32px);
    justify-content: flex-start;
  }

  #login.visible {
    opacity: 1;
    pointer-events: auto;
    animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-inner {
    width: 100%;
    max-width: 420px;
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: clamp(28px, 5vw, 40px) clamp(20px, 4vw, 32px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .login-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: clamp(24px, 5vh, 36px);
    width: 100%;
  }

  .mini-star {
    width: clamp(48px, 14vw, 60px);
    height: clamp(48px, 14vw, 60px);
    margin-bottom: 16px;
    display: block;
    background: url("../download/assets/kazer-login-symbol.png") center / contain no-repeat;
    animation: starPulse 3s ease-in-out infinite;
  }

  .login-sub {
    margin-top: 12px;
    font-size: clamp(13px, 3.5vw, 14px);
    color: var(--text-dim);
    letter-spacing: 0.3px;
    text-align: center;
    font-weight: 500;
  }

  form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field {
    position: relative;
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0 18px;
    height: 56px;
    background: rgba(0, 0, 0, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
  }

  .field:focus-within {
    border-color: var(--purple);
    background: rgba(108, 76, 241, 0.04);
    box-shadow: 0 0 0 4px var(--purple-glow);
  }

  .field svg {
    flex-shrink: 0;
    margin-right: 14px;
    opacity: 0.4;
    transition: all 0.3s ease;
  }

  .field:focus-within svg {
    opacity: 1;
    stroke: var(--purple-2);
  }

  .field input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 16px;
    height: 100%;
    font-family: inherit;
  }

  .field input::placeholder {
    color: var(--text-dim);
    font-weight: 400;
  }

  .toggle-eye {
    background: none;
    border: none;
    padding: 8px;
    margin: -8px;
    cursor: pointer;
    opacity: 0.5;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s ease;
  }

  .toggle-eye:hover {
    opacity: 1;
  }

  .eye-pupil {
    transition: transform 0.28s cubic-bezier(0.5, 0, 0.5, 1), opacity 0.15s ease;
    transform-origin: center;
    transform-box: fill-box;
  }

  .eye-icon.is-closed .eye-pupil {
    transform: scaleY(0.05);
    opacity: 0;
  }

  .eye-outline {
    transition: transform 0.28s cubic-bezier(0.5, 0, 0.5, 1);
    transform-origin: center;
    transform-box: fill-box;
  }

  .eye-icon.is-closed .eye-outline {
    transform: scaleY(0.12);
  }

  .hint {
    font-size: 12px;
    color: var(--text-dim);
    padding: 0 4px;
    line-height: 1.5;
    margin-top: -8px;
  }

  .strength-wrap {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 0 4px;
    margin-top: -4px;
  }

  body.mode-signup .strength-wrap.show {
    display: flex;
    animation: fadeUp 0.3s ease forwards;
  }

  .strength-bar {
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  .strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease, box-shadow 0.4s ease;
  }

  .strength-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--text-dim);
    transition: color 0.3s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .strength-label .icon {
    display: inline-flex;
    transition: transform 0.35s cubic-bezier(0.4, 1.6, 0.4, 1);
  }

  .strength-label.pop .icon {
    transform: scale(1.2) rotate(-5deg);
  }

  .btn-primary {
    margin-top: 8px;
    height: 56px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, var(--purple-2), var(--purple));
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 20px var(--purple-glow);
    position: relative;
    overflow: hidden;
  }

  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .btn-primary:hover:not(:disabled)::after {
    opacity: 1;
  }

  .btn-primary:active:not(:disabled) {
    transform: scale(0.98);
    box-shadow: 0 2px 10px var(--purple-glow);
  }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .btn-primary.loading {
    color: transparent;
  }

  .btn-primary.loading::before {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    top: 50%;
    left: 50%;
    margin-left: -11px;
    margin-top: -11px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .switch-mode {
    margin-top: 28px;
    text-align: center;
    font-size: 14px;
    color: var(--text-dim);
  }

  .switch-mode a {
    color: var(--purple-2);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }

  .switch-mode a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--purple-2);
    transition: width 0.3s ease;
  }

  .switch-mode a:hover {
    color: #fff;
  }

  .switch-mode a:hover::after {
    width: 100%;
  }

  .error-msg {
    font-size: 13px;
    color: #ff6b6b;
    min-height: 20px;
    text-align: center;
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.3s ease;
    font-weight: 500;
  }

  .error-msg:not(:empty) {
    opacity: 1;
  }

  .form-error-shake {
    animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-3px); }
    40%, 60% { transform: translateX(3px); }
  }

  .signup-only { display: none; }
  body.mode-signup .signup-only { display: flex; }
  body.mode-signup .signup-only.hint { display: block; }

  @media (max-height: 700px) {
    .login-inner { padding: 24px 20px; }
    .login-header { margin-bottom: 20px; }
    .field { height: 52px; }
    .btn-primary { height: 52px; }
  }
</style>
</head>
<body>

  <div id="splash" class="screen">
    <div class="brand-block">
      <div class="star-wrap">
        <svg class="star" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="core" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
              <stop offset="15%" stop-color="#ffffff" stop-opacity="1"/>
              <stop offset="45%" stop-color="#ffffff" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g transform="translate(200,200)">
            <circle r="130" fill="url(#core)"/>
            <g fill="#ffffff">
              <path d="M0,-190 C 3,-90 6,-6 0,0 C -6,-6 -3,-90 0,-190 Z"/>
              <path d="M0,190 C 3,90 6,6 0,0 C -6,6 -3,90 0,190 Z"/>
              <path d="M-190,0 C -90,-3 -6,-6 0,0 C -6,6 -90,3 -190,0 Z"/>
              <path d="M190,0 C 90,3 6,6 0,0 C 6,-6 90,-3 190,0 Z"/>
            </g>
            <g fill="#ffffff" transform="rotate(45)">
              <path d="M0,-150 C 2.5,-70 5,-5 0,0 C -5,-5 -2.5,-70 0,-150 Z"/>
              <path d="M0,150 C 2.5,70 5,5 0,0 C -5,5 -2.5,70 0,150 Z"/>
              <path d="M-150,0 C -70,-2.5 -5,-5 0,0 C -5,5 -70,2.5 -150,0 Z"/>
              <path d="M150,0 C 70,2.5 5,5 0,0 C 5,-5 70,-2.5 150,0 Z"/>
            </g>
            <circle r="12" fill="#ffffff"/>
          </g>
        </svg>
      </div>
      <div class="kazer-canvas-container" id="splashKazer"></div>
    </div>
    <div class="footer-brand">
      <span>Klipza Studio</span>
    </div>
  </div>

  <div id="login" class="screen">
    <div class="login-inner">
      <div class="login-header">
        <div class="mini-star"></div>
        <div class="kazer-canvas-container" id="loginKazer" style="width: min(78vw, 320px); height: 70px;"></div>
        <div class="login-sub" id="subText">Entrar para continuar</div>
      </div>

      <form id="authForm">
        <div class="field signup-only">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          <input type="text" id="displayName" placeholder="Como devemos te chamar?" autocomplete="name" maxlength="80" spellcheck="false">
        </div>

        <div class="field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8"><path d="M3 6l9 7 9-7"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
          <input type="email" id="email" placeholder="Email" required autocomplete="email" maxlength="254" inputmode="email">
        </div>

        <div class="field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input type="password" id="password" placeholder="Senha" required autocomplete="current-password" minlength="10" maxlength="256">
          <button type="button" class="toggle-eye" id="eyeBtnPassword" aria-label="Mostrar senha">
            <svg class="eye-icon is-open" id="eyeIconPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8">
              <path class="eye-outline" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle class="eye-pupil" cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="strength-wrap" id="strengthWrap">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <div class="strength-label" id="strengthLabel">
            <span class="icon">✦</span>
            <span id="strengthText">Digite uma senha</span>
          </div>
        </div>

        <div class="hint signup-only" id="passwordHint">
          A senha precisa ter pelo menos 10 caracteres, 1 letra maiúscula e 1 caractere especial.
        </div>

        <div class="field signup-only">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input type="password" id="confirmPassword" placeholder="Confirmar senha" autocomplete="new-password" minlength="10" maxlength="256">
          <button type="button" class="toggle-eye" id="eyeBtnConfirmPassword" aria-label="Mostrar senha">
            <svg class="eye-icon is-open" id="eyeIconConfirmPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8">
              <path class="eye-outline" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle class="eye-pupil" cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
      </form>

      <div class="switch-mode">
        <span id="switchText">Não tem conta?</span>
        <a id="switchLink" href="#signup">Criar conta</a>
      </div>
    </div>
  </div>

<script type="module">
  import * as THREE from "https://esm.sh/three@0.160.0";
  import { ShaderPass } from "https://esm.sh/three@0.160.0/examples/jsm/postprocessing/ShaderPass.js";
  import { HorizontalBlurShader } from "https://esm.sh/three@0.160.0/examples/jsm/shaders/HorizontalBlurShader.js";
  import { VerticalBlurShader } from "https://esm.sh/three@0.160.0/examples/jsm/shaders/VerticalBlurShader.js";
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  function setVH() {
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', setVH);

  function initKazerEffect(containerId, text) {
    const container = document.getElementById(containerId);
    if (!container) return null;

    const pr = Math.min(2, window.devicePixelRatio);
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 4, -4);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(pr);
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    const state = {
      band: { amount: 140, cutoff: 4.5, scale: 5.5 },
      img: { blur: 6, cutoff: 2.2, darken: 1.3 }
    };

    const width = 512;
    const height = 128;
    const CanvasConstructor = window.OffscreenCanvas || HTMLCanvasElement;
    const offCanvas = new CanvasConstructor(width, height);
    const ctx = offCanvas.getContext("2d");
    
    function drawText() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "white";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 72px 'UnifrakturMaguntia', cursive";
      ctx.fillText(text, width / 2, height / 2);
    }
    drawText();

    const inputTexture = new THREE.CanvasTexture(offCanvas);
    inputTexture.needsUpdate = true;

    class BlurFilter {
      constructor(renderer, w, h) {
        this.renderer = renderer;
        this.rt_a = new THREE.WebGLRenderTarget(w, h);
        this.rt_b = this.rt_a.clone();
        this.x_pass = new ShaderPass(HorizontalBlurShader);
        this.y_pass = new ShaderPass(VerticalBlurShader);
        this.x_pass.uniforms.h.value = 1 / w;
        this.y_pass.uniforms.v.value = 1 / h;
      }
      render(texture, repeat) {
        this.renderer.copyTextureToTexture(texture, this.rt_a.texture);
        for (let i = 0; i < repeat; i++) {
          this.x_pass.render(this.renderer, this.rt_b, this.rt_a);
          this.y_pass.render(this.renderer, this.rt_a, this.rt_b);
        }
      }
      get texture() { return this.rt_a.texture; }
    }

    const blur = new BlurFilter(renderer, width, height);
    blur.render(inputTexture, state.img.blur);

    const band_geometry = new THREE.PlaneGeometry(2, 2);
    const band_material = new THREE.RawShaderMaterial({
      glslVersion: THREE.GLSL3,
      transparent: true,
      uniforms: {
        amount: { value: state.band.amount },
        band_scale: { value: state.band.scale },
        map: { value: blur.texture },
        img_cutoff: { value: state.img.cutoff },
        band_cutoff: { value: 2 ** state.band.cutoff },
        fill_darken: { value: 2 ** state.img.darken },
        color: { value: new THREE.Color(0x9b9dff) }
      },
      vertexShader: `
        #extension GL_ANGLE_instanced_arrays : enable
        precision highp float;
        in vec3 position;
        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;
        uniform float amount;
        uniform float band_scale;
        out vec2 vuv;
        out vec2 suv;
        void main() {
          vec2 pos = position.xy;
          vuv = pos * 0.5 + 0.5;
          pos.y += 1.0;
          pos.y *= 0.5;
          pos.x *= 2.0 * band_scale;
          float z_step = 4.0 * band_scale / amount;
          float z = 2.0 * band_scale - float(gl_InstanceID) * z_step;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, z, 1.0);
          suv = (gl_Position.xy / gl_Position.w) * 0.5 + 0.5;
        }
      `,
      fragmentShader: `
        precision highp float;
        in vec2 vuv;
        in vec2 suv;
        uniform sampler2D map;
        uniform float img_cutoff;
        uniform float band_cutoff;
        uniform float fill_darken;
        uniform vec3 color;
        out vec4 Color;
        void main() {
          float y = 1.0 - vuv.y;
          if (y < 0.005 || y > 0.995) discard;
          float a = texture(map, suv).r;
          a *= pow(y, img_cutoff);
          y = pow(y, band_cutoff);
          a = 1.0 - (1.0 - a) * (1.0 - y);
          if (a < 0.4) discard;
          a = (1.0 - a) * 2.0;
          vec3 finalColor = color * pow(a, fill_darken);
          Color = vec4(finalColor, smoothstep(0.4, 1.0, a));
        }
      `
    });

    const bands_mesh = new THREE.InstancedMesh(band_geometry, band_material, state.band.amount);
    bands_mesh.frustumCulled = false;
    bands_mesh.rotation.x = -45 * THREE.MathUtils.DEG2RAD;
    scene.add(bands_mesh);

    const world_z = new THREE.Vector3(0, 0, 1);
    let time = 0;

    function animate(t) {
      requestAnimationFrame(animate);
      const dt = t - time;
      time = t;
      bands_mesh.rotateOnWorldAxis(world_z, dt * 0.00035);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    const resize = () => {
      const rect = container.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        renderer.setSize(rect.width, rect.height, false);
      }
    };
    window.addEventListener('resize', resize);
    
    document.fonts.ready.then(() => {
      drawText();
      inputTexture.needsUpdate = true;
      blur.render(inputTexture, state.img.blur);
      resize();
    }).catch(() => {
      drawText();
      inputTexture.needsUpdate = true;
      blur.render(inputTexture, state.img.blur);
      resize();
    });
    
    return renderer;
  }

  // Inicializa efeitos visuais
  const splashRenderer = initKazerEffect('splashKazer', 'KAZER');

  function togglePassword(id) {
    const input = document.getElementById(id);
    const btn = document.getElementById('eyeBtn' + id.charAt(0).toUpperCase() + id.slice(1));
    const icon = document.getElementById('eyeIcon' + id.charAt(0).toUpperCase() + id.slice(1));
    const isHidden = input.type === 'password';

    input.type = isHidden ? 'text' : 'password';
    if (isHidden) {
      icon.classList.remove('is-open');
      icon.classList.add('is-closed');
    } else {
      icon.classList.remove('is-closed');
      icon.classList.add('is-open');
    }
    btn.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Mostrar senha');
  }

  document.getElementById('eyeBtnPassword').addEventListener('click', () => togglePassword('password'));
  document.getElementById('eyeBtnConfirmPassword').addEventListener('click', () => togglePassword('confirmPassword'));

  let isSignup = false;
  function toggleMode() {
    isSignup = !isSignup;
    const body = document.body;
    const sub = document.getElementById('subText');
    const submitBtn = document.getElementById('submitBtn');
    const switchText = document.getElementById('switchText');
    const switchLink = document.getElementById('switchLink');
    const confirmInput = document.getElementById('confirmPassword');
    const nameInput = document.getElementById('displayName');
    const errorMsg = document.getElementById('errorMsg');

    if (isSignup) {
      body.classList.add('mode-signup');
      sub.textContent = 'Criar sua conta';
      submitBtn.textContent = 'Criar conta';
      switchText.textContent = 'Já tem conta?';
      switchLink.textContent = 'Entrar';
      confirmInput.setAttribute('required', 'true');
      nameInput.setAttribute('required', 'true');
    } else {
      body.classList.remove('mode-signup');
      sub.textContent = 'Entrar para continuar';
      submitBtn.textContent = 'Sign in';
      switchText.textContent = 'Não tem conta?';
      switchLink.textContent = 'Criar conta';
      confirmInput.removeAttribute('required');
      nameInput.removeAttribute('required');
      document.getElementById('strengthWrap').classList.remove('show');
    }
    errorMsg.textContent = '';
    errorMsg.dataset.type = '';
  }

  document.getElementById('switchLink').addEventListener('click', (event) => {
    event.preventDefault();
    toggleMode();
  });

  function getPasswordStrength(pw) {
    if (!pw) return 0;
    let score = 0;
    if (pw.length >= 6) score++;
    if (pw.length >= 10) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (pw.length < 6) score = Math.min(score, 1);
    return Math.min(score, 4);
  }

  const strengthConfig = {
    0: { pct: 4, color: '#ff4757', text: 'Digite uma senha' },
    1: { pct: 25, color: '#ff4757', text: 'Senha fraca — capriche mais' },
    2: { pct: 50, color: '#ffa502', text: 'Quase lá, dá pra melhorar' },
    3: { pct: 75, color: '#ffd84e', text: 'Boa senha!' },
    4: { pct: 100, color: '#2ed573', text: 'Senha forte, mandou bem!' }
  };

  const strengthWrap = document.getElementById('strengthWrap');
  const strengthFill = document.getElementById('strengthFill');
  const strengthLabel = document.getElementById('strengthLabel');
  const strengthText = document.getElementById('strengthText');

  function updateStrengthUI(pw) {
    if (!pw) {
      strengthWrap.classList.remove('show');
      return;
    }
    strengthWrap.classList.add('show');
    const level = getPasswordStrength(pw);
    const cfg = strengthConfig[level];

    strengthFill.style.width = cfg.pct + '%';
    strengthFill.style.background = cfg.color;
    strengthFill.style.boxShadow = `0 0 12px ${cfg.color}66`;
    strengthText.textContent = cfg.text;
    strengthLabel.style.color = cfg.color;

    strengthFill.classList.remove('pulse');
    strengthLabel.classList.remove('pop');
    void strengthFill.offsetWidth;
    strengthFill.classList.add('pulse');
    strengthLabel.classList.add('pop');
  }

  document.getElementById('password').addEventListener('input', function() {
    if (isSignup) updateStrengthUI(this.value);
    checkPasswordsMatch();
  });

  const confirmField = document.getElementById('confirmPassword');
  function checkPasswordsMatch() {
    const errorMsg = document.getElementById('errorMsg');
    const pw = document.getElementById('password').value;
    const confirmPw = confirmField.value;

    if (!isSignup || !confirmPw) {
      if (errorMsg.dataset.type === 'mismatch') errorMsg.textContent = '';
      return;
    }

    if (pw !== confirmPw) {
      errorMsg.textContent = 'As senhas não coincidem. Verifique e tente novamente.';
      errorMsg.dataset.type = 'mismatch';
    } else if (errorMsg.dataset.type === 'mismatch') {
      errorMsg.textContent = '';
      errorMsg.dataset.type = '';
    }
  }
  confirmField.addEventListener('input', checkPasswordsMatch);

  const KAZER_SUPABASE_URL = 'https://mqjunopzycdezzjmlhip.supabase.co';
  const KAZER_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xanVub3B6eWNkZXp6am1saGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4Mzg3NDksImV4cCI6MjEwMzQxNDc0OX0.Y_o2_QQhZzuCjvHdEfxaR5VrAxo7NFenPaDmdHN3bwM';
  
  const kazerSupabase = createClient(KAZER_SUPABASE_URL, KAZER_SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
  });

  function authErrorMessage(error) {
    const message = String(error?.message || '').toLowerCase();
    if (message.includes('invalid login credentials')) return 'E-mail ou senha incorretos.';
    if (message.includes('email not confirmed')) return 'O acesso por e-mail ainda não está liberado no projeto Kazer.';
    if (message.includes('user already registered')) return 'Este e-mail já possui uma conta. Tente entrar.';
    if (message.includes('password')) return 'A senha não atende aos requisitos de segurança do Kazer.';
    return 'Não foi possível concluir agora. Tente novamente.';
  }

  document.getElementById('authForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    const form = this;
    
    const name = document.getElementById('displayName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!kazerSupabase) {
      errorMsg.textContent = 'A conexão segura do Kazer não carregou. Atualize a página.';
      return;
    }

    if (isSignup) {
      if (!name || name.length > 80) {
        errorMsg.textContent = 'Informe um nome válido de até 80 caracteres.';
        form.classList.add('form-error-shake');
        setTimeout(() => form.classList.remove('form-error-shake'), 400);
        return;
      }
      if (password.length < 10 || !/[A-Z]/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
        errorMsg.textContent = 'Sua senha precisa de pelo menos 10 caracteres, 1 letra maiúscula e 1 caractere especial.';
        form.classList.add('form-error-shake');
        setTimeout(() => form.classList.remove('form-error-shake'), 400);
        return;
      }
      if (password !== confirmPassword) {
        errorMsg.textContent = 'As senhas não coincidem. Verifique e tente novamente.';
        form.classList.add('form-error-shake');
        setTimeout(() => form.classList.remove('form-error-shake'), 400);
        return;
      }
    }

    errorMsg.textContent = '';
    submitBtn.disabled = true;
    submitBtn.classList.add('loading');
    submitBtn.textContent = isSignup ? 'Criando conta…' : 'Entrando…';

    try {
      const result = isSignup
        ? await kazerSupabase.auth.signUp({
            email,
            password,
            options: {
              data: { display_name: name },
              emailRedirectTo: `${window.location.origin}/chat`
            }
          })
        : await kazerSupabase.auth.signInWithPassword({ email, password });

      if (result.error) throw result.error;
      if (!result.data.session) {
        throw new Error('A sessão imediata ainda não está habilitada no projeto Kazer.');
      }
      
      if (isSignup && result.data.user?.id) {
        try {
          await kazerSupabase.from('profiles').update({ display_name: name }).eq('id', result.data.user.id);
        } catch (_) {}
      }
      
      try { await kazerSupabase.rpc('touch_user_activity'); } catch (_) {}
      
      window.location.assign('/chat');
    } catch (error) {
      errorMsg.style.color = '#ff6b6b';
      errorMsg.textContent = authErrorMessage(error);
      submitBtn.disabled = false;
      submitBtn.classList.remove('loading');
      submitBtn.textContent = isSignup ? 'Criar conta' : 'Sign in';
      
      form.classList.add('form-error-shake');
      setTimeout(() => form.classList.remove('form-error-shake'), 400);
    }
  });

  // Transição splash -> login com timeout de segurança
  window.addEventListener('load', function() {
    const splash = document.getElementById('splash');
    const login = document.getElementById('login');
    
    let transitioned = false;
    
    function doTransition() {
      if (transitioned) return;
      transitioned = true;
      
      setTimeout(() => {
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.display = 'none';
          login.classList.add('visible');
        }, 800);
      }, 2500);
    }
    
    // Verifica sessão com timeout
    if (kazerSupabase) {
      const sessionCheck = kazerSupabase.auth.getSession()
        .then(result => {
          const session = result?.data?.session || null;
          if (session) {
            setTimeout(() => { window.location.assign('/chat'); }, 1500);
            return true;
          }
          return false;
        })
        .catch(() => false);
      
      // Timeout de 3 segundos para garantir transição
      setTimeout(() => {
        sessionCheck.then(hasSession => {
          if (!hasSession) {
            doTransition();
          }
        }).catch(() => {
          doTransition();
        });
      }, 3000);
    } else {
      // Se Supabase não carregou, faz transição mesmo assim
      doTransition();
    }
  });
</script>
