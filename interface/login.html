<script type="module">
  import * as THREE from "https://esm.sh/three@0.185.1";

  import { ShaderPass } from
    "https://esm.sh/three@0.185.1/examples/jsm/postprocessing/ShaderPass.js";

  import { HorizontalBlurShader } from
    "https://esm.sh/three@0.185.1/examples/jsm/shaders/HorizontalBlurShader.js";

  import { VerticalBlurShader } from
    "https://esm.sh/three@0.185.1/examples/jsm/shaders/VerticalBlurShader.js";


  /* ============================================================
     KAZER — FUNDO TIPOGRÁFICO 3D
     inspirado na referência enviada
  ============================================================ */

  const canvas = document.getElementById("fxCanvas");

  if (!canvas) {
    throw new Error("Kazer FX canvas não encontrado.");
  }


  /* ============================================================
     PERFORMANCE
  ============================================================ */

  const pr = Math.min(
    1.8,
    window.devicePixelRatio || 1
  );


  /* ============================================================
     THREE
  ============================================================ */

  const scene = new THREE.Scene();

  const camera =
    new THREE.OrthographicCamera(
      -1,
      1,
      1,
      -1,
      4,
      -4
    );

  camera.position.z = 1;


  const renderer =
    new THREE.WebGLRenderer({
      canvas,
      alpha: false,
      antialias: true,
      powerPreference: "high-performance"
    });


  renderer.setPixelRatio(pr);

  renderer.setSize(
    window.innerWidth,
    window.innerHeight,
    false
  );


  /* ============================================================
     TEXTO KAZER
  ============================================================ */

  function createTextCanvas(
    width,
    height,
    text
  ) {

    const scale = 0.5 / pr;

    const internalWidth =
      Math.max(
        1,
        Math.floor(width * scale)
      );

    const internalHeight =
      Math.max(
        1,
        Math.floor(height * scale)
      );

    const textCanvas =
      new OffscreenCanvas(
        internalWidth,
        internalHeight
      );

    const ctx =
      textCanvas.getContext(
        "2d",
        {
          alpha: true
        }
      );

    if (!ctx) {
      throw new Error(
        "Canvas 2D indisponível."
      );
    }


    function draw() {

      const w =
        textCanvas.width;

      const h =
        textCanvas.height;

      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      /*
       * Texto gigante.
       * Fazemos o KAZER ocupar quase
       * toda a área.
       */

      let fontSize =
        Math.min(w, h) * 0.48;


      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";

      ctx.font =
        `900 ${fontSize}px Arial Black, Arial, sans-serif`;

      /*
       * diminui o tamanho caso necessário
       */
      const measured =
        ctx.measureText(text).width;


      if (measured > w * 1.75) {

        fontSize *=
          (w * 1.75) / measured;

        ctx.font =
          `900 ${fontSize}px Arial Black, Arial, sans-serif`;
      }


      /*
       * Pequeno brilho central.
       */

      const gradient =
        ctx.createLinearGradient(
          0,
          h * 0.18,
          0,
          h * 0.82
        );

      gradient.addColorStop(
        0,
        "rgba(255,255,255,0.96)"
      );

      gradient.addColorStop(
        0.46,
        "rgba(255,255,255,1)"
      );

      gradient.addColorStop(
        1,
        "rgba(195,190,255,0.82)"
      );


      ctx.fillStyle =
        gradient;


      /*
       * Texto principal.
       */

      ctx.fillText(
        text,
        w / 2,
        h / 2
      );


      /*
       * Segundo brilho sutil.
       */

      ctx.globalCompositeOperation =
        "source-atop";

      const shine =
        ctx.createLinearGradient(
          0,
          0,
          w,
          0
        );

      shine.addColorStop(
        0,
        "rgba(255,255,255,0)"
      );

      shine.addColorStop(
        0.42,
        "rgba(255,255,255,0.12)"
      );

      shine.addColorStop(
        0.5,
        "rgba(255,255,255,0.34)"
      );

      shine.addColorStop(
        0.58,
        "rgba(255,255,255,0.08)"
      );

      shine.addColorStop(
        1,
        "rgba(255,255,255,0)"
      );

      ctx.fillStyle =
        shine;

      ctx.fillRect(
        0,
        0,
        w,
        h
      );

      ctx.globalCompositeOperation =
        "source-over";
    }


    draw();


    return {
      canvas: textCanvas,

      resize(nextWidth, nextHeight) {

        const nw =
          Math.max(
            1,
            Math.floor(
              nextWidth * scale
            )
          );

        const nh =
          Math.max(
            1,
            Math.floor(
              nextHeight * scale
            )
          );

        textCanvas.width =
          nw;

        textCanvas.height =
          nh;

        draw();
      },

      update: draw
    };
  }


  let textInput =
    createTextCanvas(
      window.innerWidth,
      window.innerHeight,
      "KAZER"
    );


  const textTexture =
    new THREE.CanvasTexture(
      textInput.canvas
    );


  textTexture.minFilter =
    THREE.LinearFilter;

  textTexture.magFilter =
    THREE.LinearFilter;

  textTexture.generateMipmaps =
    false;


  /* ============================================================
     BLUR
  ============================================================ */

  class BlurFilter {

    constructor(
      renderer,
      width,
      height
    ) {

      this.renderer =
        renderer;


      this.horizontal =
        new ShaderPass(
          HorizontalBlurShader
        );


      this.vertical =
        new ShaderPass(
          VerticalBlurShader
        );


      this.rtA =
        new THREE.WebGLRenderTarget(
          width,
          height,
          {
            minFilter:
              THREE.LinearFilter,

            magFilter:
              THREE.LinearFilter,

            format:
              THREE.RGBAFormat,

            depthBuffer:
              false,

            stencilBuffer:
              false
          }
        );


      this.rtB =
        this.rtA.clone();
    }


    setSize(
      width,
      height
    ) {

      width =
        Math.max(
          1,
          Math.floor(width)
        );

      height =
        Math.max(
          1,
          Math.floor(height)
        );


      this.rtA.setSize(
        width,
        height
      );

      this.rtB.setSize(
        width,
        height
      );


      this.horizontal.uniforms.h.value =
        1 / width;

      this.vertical.uniforms.v.value =
        1 / height;
    }


    render(
      texture,
      iterations
    ) {

      /*
       * Atualiza a textura original.
       */

      this.renderer.copyTextureToTexture(
        texture,
        this.rtA.texture
      );


      for (
        let i = 0;
        i < iterations;
        i++
      ) {

        this.horizontal.render(
          this.renderer,
          this.rtB,
          this.rtA,
          0,
          false
        );


        this.vertical.render(
          this.renderer,
          this.rtA,
          this.rtB,
          0,
          false
        );
      }


      this.renderer.setRenderTarget(
        null
      );
    }


    get texture() {
      return this.rtA.texture;
    }
  }


  const blur =
    new BlurFilter(
      renderer,
      1,
      1
    );


  /* ============================================================
     BAND MATERIAL
  ============================================================ */

  const bandGeometry =
    new THREE.PlaneGeometry(
      2,
      2
    );


  /*
   * Quantidade das faixas.
   *
   * Desktop:
   * 180
   *
   * Mobile:
   * menos para economizar GPU.
   */

  const isMobile =
    Math.min(
      window.innerWidth,
      window.innerHeight
    ) < 700;


  const bandAmount =
    isMobile
      ? 120
      : 180;


  const bandMaterial =
    new THREE.RawShaderMaterial({

      glslVersion:
        THREE.GLSL3,

      transparent:
        true,

      depthWrite:
        false,

      uniforms: {

        amount: {
          value: bandAmount
        },

        bandScale: {
          value: isMobile
            ? 5.7
            : 7.0
        },

        map: {
          value: blur.texture
        },

        imageCutoff: {
          value: 2.8
        },

        bandCutoff: {
          value: Math.pow(
            2,
            6
          )
        },

        darken: {
          value: 1.25
        },

        color: {
          value:
            new THREE.Color(
              0.78,
              0.75,
              1.0
            )
        }
      },


      vertexShader: `

        precision highp float;

        in vec3 position;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;

        uniform float amount;
        uniform float bandScale;

        out vec2 vUv;
        out vec2 screenUv;


        void main() {

          vec2 pos =
            position.xy;


          vUv =
            pos * 0.5 + 0.5;


          /*
           * Cada instância é uma faixa
           */

          pos.y += 1.0;
          pos.y *= 0.5;


          pos.x *=
            2.0 *
            bandScale;


          float zStep =
            4.0 *
            bandScale /
            amount;


          float z =
            2.0 *
            bandScale
            -
            float(gl_InstanceID)
            *
            zStep;


          /*
           * Pequena curvatura
           * espacial das faixas.
           */

          float layer =
            float(gl_InstanceID)
            /
            amount;


          pos.x +=
            sin(
              layer * 6.2831
            ) * 0.015;


          gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(
              pos,
              z,
              1.0
            );


          screenUv =
            gl_Position.xy /
            gl_Position.w *
            0.5 +
            0.5;
        }
      `,


      fragmentShader: `

        precision highp float;

        in vec2 vUv;
        in vec2 screenUv;

        uniform sampler2D map;

        uniform float imageCutoff;
        uniform float bandCutoff;
        uniform float darken;

        uniform vec3 color;

        out vec4 outColor;


        void main() {

          float y =
            1.0 -
            vUv.y;


          /*
           * bordas invisíveis
           */

          if (
            y < 0.006 ||
            y > 0.994
          ) {
            discard;
          }


          /*
           * imagem borrada
           */

          float alpha =
            texture(
              map,
              screenUv
            ).r;


          alpha *=
            pow(
              y,
              imageCutoff
            );


          y =
            pow(
              y,
              bandCutoff
            );


          /*
           * composição das faixas
           */

          alpha =
            1.0 -
            (
              1.0 - alpha
            ) *
            (
              1.0 - y
            );


          if (
            alpha < 0.45
          ) {
            discard;
          }


          alpha =
            (
              1.0 - alpha
            ) * 2.0;


          float intensity =
            pow(
              alpha,
              darken
            );


          /*
           * brilho principal
           */

          vec3 finalColor =
            color *
            intensity;


          /*
           * pequena borda luminosa
           */

          finalColor +=
            vec3(
              0.10,
              0.08,
              0.18
            )
            *
            intensity;


          outColor =
            vec4(
              finalColor,
              intensity * 0.72
            );
        }
      `
    });


  const bandsMesh =
    new THREE.InstancedMesh(
      bandGeometry,
      bandMaterial,
      bandAmount
    );


  bandsMesh.frustumCulled =
    false;


  /*
   * Inclinação semelhante
   * à referência.
   */

  bandsMesh.rotation.x =
    -45 *
    THREE.MathUtils.DEG2RAD;


  /*
   * Leve rotação inicial.
   */

  bandsMesh.rotation.z =
    -7 *
    THREE.MathUtils.DEG2RAD;


  scene.add(
    bandsMesh
  );


  /* ============================================================
     FUNDO ESCURO
  ============================================================ */

  renderer.setClearColor(
    new THREE.Color(
      0.008,
      0.006,
      0.012
    ),
    1
  );


  /* ============================================================
     RESIZE
  ============================================================ */

  function resize() {

    const width =
      window.innerWidth;

    const height =
      window.innerHeight;


    renderer.setSize(
      width,
      height,
      false
    );


    const renderWidth =
      width * pr;

    const renderHeight =
      height * pr;


    blur.setSize(
      renderWidth * 0.5,
      renderHeight * 0.5
    );


    textInput.resize(
      renderWidth,
      renderHeight
    );


    textTexture.needsUpdate =
      true;


    /*
     * proporção da câmera
     */

    if (
      height > width
    ) {

      camera.left =
        -1;

      camera.right =
        1;

      camera.top =
        height / width;

      camera.bottom =
        -(height / width);

    } else {

      camera.left =
        -(width / height);

      camera.right =
        width / height;

      camera.top =
        1;

      camera.bottom =
        -1;
    }


    camera.updateProjectionMatrix();


    /*
     * intensidade adaptativa
     */

    const currentScale =
      Math.min(
        width,
        height
      ) < 700
        ? 5.7
        : 7.0;


    bandMaterial
      .uniforms
      .bandScale
      .value =
        currentScale;
  }


  window.addEventListener(
    "resize",
    resize,
    {
      passive: true
    }
  );


  /* ============================================================
     MOVIMENTO DO MOUSE
  ============================================================ */

  const targetRotation =
    new THREE.Vector2(
      -0.12,
      -0.04
    );


  const currentRotation =
    new THREE.Vector2(
      -0.12,
      -0.04
    );


  window.addEventListener(
    "pointermove",
    event => {

      const x =
        event.clientX /
        window.innerWidth -
        0.5;


      const y =
        event.clientY /
        window.innerHeight -
        0.5;


      targetRotation.x =
        -0.12 +
        y * 0.08;


      targetRotation.y =
        -0.04 +
        x * 0.08;
    },
    {
      passive: true
    }
  );


  /* ============================================================
     LOOP
  ============================================================ */

  let previousTime =
    performance.now();


  renderer.setAnimationLoop(
    currentTime => {

      const delta =
        currentTime -
        previousTime;


      previousTime =
        currentTime;


      /*
       * suavização
       */

      currentRotation.lerp(
        targetRotation,
        0.025
      );


      bandsMesh.rotation.x =
        currentRotation.x;


      bandsMesh.rotation.y =
        currentRotation.y;


      /*
       * movimento bem lento,
       * igual ao conceito da referência.
       */

      bandsMesh.rotateOnWorldAxis(
        new THREE.Vector3(
          0,
          0,
          1
        ),
        delta *
        0.00011
      );


      /*
       * blur dinâmico
       */

      textTexture.needsUpdate =
        true;


      blur.render(
        textTexture,
        isMobile
          ? 4
          : 6
      );


      renderer.render(
        scene,
        camera
      );
    }
  );


  resize();
</script>
