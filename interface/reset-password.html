<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Recuperar conta — KAZER</title>
  <link rel="icon" href="../download/assets/kazer-login-symbol.png" type="image/png" />
  <link rel="apple-touch-icon" href="../download/assets/kazer-login-symbol.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#000;--text:#fff;--muted:rgba(255,255,255,.58);--border:rgba(255,255,255,.22);--purple:#6c4cf1;--purple-2:#7b5cff;--danger:#ff6b6b;--warning:#e7bc69}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text)}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 24px;min-height:100dvh}
    .shell{width:100%;max-width:400px;text-align:center}
    .symbol{width:70px;height:70px;margin:0 auto 18px;background:url("../download/assets/kazer-login-symbol.png") center/contain no-repeat;animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
    .title{font-family:"UnifrakturMaguntia",cursive;font-size:clamp(46px,16vw,72px);line-height:.9;letter-spacing:1px;margin:0 0 12px;background:linear-gradient(105deg,#555961,#f4f5f6 18%,#777c85 35%,#fff 48%,#4c515a 66%,#d9dde2 82%,#60656e);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-size:21px;line-height:1.2;margin:0 0 8px;font-weight:600}
    .lead{font-size:14px;line-height:1.5;color:var(--muted);margin:0 auto 28px;max-width:340px}
    .panel{display:flex;flex-direction:column;gap:14px;text-align:left}
    .field{height:54px;display:flex;align-items:center;border:1px solid var(--border);border-radius:14px;padding:0 16px;background:rgba(255,255,255,.02);transition:border-color .2s ease}
    .field:focus-within{border-color:var(--purple-2)}
    .field svg{width:18px;height:18px;flex:0 0 auto;margin-right:12px;opacity:.72}
    .field input{width:100%;height:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}
    .field input::placeholder{color:var(--muted)}
    .field.code input{text-align:center;letter-spacing:.48em;font-variant-numeric:tabular-nums;padding-left:.48em;font-weight:600}
    .btn{width:100%;height:54px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--purple-2),var(--purple));color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:filter .2s ease,transform .15s ease}
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .back{display:block;margin:20px auto 0;color:var(--muted);font-size:14px;text-decoration:none}
    .back:hover,.back:focus-visible{color:var(--text);text-decoration:underline}
    .message{min-height:18px;margin:2px 0 0;text-align:center;font-size:13px;line-height:1.4;color:var(--danger)}
    .message.warning{color:var(--warning)}
    [hidden]{display:none!important}
    @media (max-height:640px){body{padding:20px 24px}.symbol{width:54px;height:54px;margin-bottom:12px}.title{font-size:52px}.lead{margin-bottom:18px}.field,.btn{height:48px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="symbol" aria-hidden="true"></div>
    <div class="title" aria-label="KAZER">KAZER</div>
    <section id="requestPanel">
      <h1>Recuperar conta</h1>
      <p class="lead">Digite o e-mail da sua conta. Enviaremos um código de 6 dígitos para você criar uma nova senha.</p>
      <form class="panel" id="requestForm" novalidate>
        <label class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6l9 7 9-7"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
          <input id="recoveryEmail" type="email" autocomplete="email" placeholder="E-mail da conta" required />
        </label>
        <button class="btn" id="requestButton" type="submit">Enviar código</button>
        <p class="message" id="requestMessage" aria-live="polite"></p>
      </form>
    </section>

    <section id="codePanel" hidden>
      <h1>Digite o código</h1>
      <p class="lead">Confira sua caixa de entrada. O código foi enviado pelo Kazer para confirmar a recuperação.</p>
      <form class="panel" id="codeForm" novalidate>
        <label class="field code">
          <input id="recoveryCode" type="text" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required />
        </label>
        <label class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="Nova senha" required />
        </label>
        <label class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="confirmNewPassword" type="password" autocomplete="new-password" placeholder="Confirmar nova senha" required />
        </label>
        <button class="btn" id="updateButton" type="submit">Recuperar conta</button>
        <p class="message" id="codeMessage" aria-live="polite"></p>
      </form>
    </section>
    <a class="back" href="/login">Voltar para entrar</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const supabaseClient = window.supabase?.createClient(
        'https://mqjunopzycdezzjmlhip.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xanVub3B6eWNkZXp6am1saGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4Mzg3NDksImV4cCI6MjEwMzQxNDc0OX0.Y_o2_QQhZzuCjvHdEfxaR5VrAxo7NFenPaDmdHN3bwM',
        { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
      );
      const requestPanel = document.getElementById('requestPanel');
      const codePanel = document.getElementById('codePanel');
      const requestForm = document.getElementById('requestForm');
      const codeForm = document.getElementById('codeForm');
      const emailInput = document.getElementById('recoveryEmail');
      const codeInput = document.getElementById('recoveryCode');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmInput = document.getElementById('confirmNewPassword');
      const requestButton = document.getElementById('requestButton');
      const updateButton = document.getElementById('updateButton');
      const requestMessage = document.getElementById('requestMessage');
      const codeMessage = document.getElementById('codeMessage');

      const showCodePanel = () => {
        requestPanel.hidden = true;
        codePanel.hidden = false;
        codeInput.focus();
      };
      const readableError = (error) => error?.message || 'Não foi possível concluir a recuperação agora.';
      const validPassword = (value) => value.length >= 6 && /[A-Z]/.test(value) && /[^A-Za-z0-9]/.test(value);
      const emailFromUrl = new URLSearchParams(window.location.search).get('email');
      if (emailFromUrl) {
        emailInput.value = emailFromUrl;
        showCodePanel();
      }

      requestForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = emailInput.value.trim();
        requestMessage.className = 'message';
        requestMessage.textContent = '';
        if (!supabaseClient) { requestMessage.textContent = 'A conexão segura não carregou. Atualize a página.'; return; }
        if (!emailInput.checkValidity()) { requestMessage.textContent = 'Digite um e-mail válido.'; return; }
        requestButton.disabled = true;
        requestButton.textContent = 'Enviando…';
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: `${window.location.origin}/recuperar?email=${encodeURIComponent(email)}` });
        requestButton.disabled = false;
        requestButton.textContent = 'Enviar código';
        if (error) { requestMessage.textContent = readableError(error); return; }
        requestMessage.className = 'message warning';
        requestMessage.textContent = 'Se existir uma conta com esse e-mail, o código chegará em instantes.';
        showCodePanel();
      });

      codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6); });
      codeForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = emailInput.value.trim();
        const token = codeInput.value.trim();
        const password = newPasswordInput.value;
        const confirmation = confirmInput.value;
        codeMessage.className = 'message';
        codeMessage.textContent = '';
        if (!supabaseClient) { codeMessage.textContent = 'A conexão segura não carregou. Atualize a página.'; return; }
        if (!/^\d{6}$/.test(token)) { codeMessage.textContent = 'Digite o código de 6 dígitos recebido.'; return; }
        if (!validPassword(password)) { codeMessage.textContent = 'A nova senha precisa ter 6 caracteres, uma letra maiúscula e um caractere especial.'; return; }
        if (password !== confirmation) { codeMessage.textContent = 'As senhas não coincidem.'; return; }
        updateButton.disabled = true;
        updateButton.textContent = 'Verificando…';
        const verified = await supabaseClient.auth.verifyOtp({ email, token, type: 'recovery' });
        if (verified.error) {
          codeMessage.textContent = readableError(verified.error);
          updateButton.disabled = false;
          updateButton.textContent = 'Recuperar conta';
          return;
        }
        const updated = await supabaseClient.auth.updateUser({ password });
        if (updated.error) {
          codeMessage.textContent = readableError(updated.error);
          updateButton.disabled = false;
          updateButton.textContent = 'Recuperar conta';
          return;
        }
        window.location.assign('/chat');
      });
    })();
  </script>
</body>
</html>
