<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KAZER CODER</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  color-scheme: dark;
  --page: #070707;
  --page-soft: #0d0d0f;
  --card: #151516;
  --card-2: #1b1b1d;
  --card-3: #222225;
  --line: rgba(255,255,255,0.12);
  --line-soft: rgba(255,255,255,0.06);
  --text: #f4f4f4;
  --text-soft: #a7a7ab;
  --text-dim: #6d6d72;
  --accent: #8c7aff;
  --accent-ink: #090909;
  --success: #69d2a1;
  --danger: #f07474;
  --purple: #8c7aff;
  --metal-gradient: linear-gradient(105deg,#555961 0%,#f4f5f6 18%,#777c85 35%,#ffffff 48%,#4c515a 66%,#d9dde2 82%,#60656e 100%);
  --ease: cubic-bezier(0.22,1,0.36,1);
  --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --brand: "UnifrakturMaguntia", cursive;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--page); color: var(--text); font-family: var(--sans); overflow: hidden; }
button { font: inherit; border: 0; background: transparent; color: inherit; cursor: pointer; }
.icon { width: 18px; height: 18px; flex: 0 0 auto; }

/* LAYOUT */
.app { display: grid; grid-template-columns: 260px 1fr; height: 100dvh; }

/* SIDEBAR */
.sidebar {
  display: flex; flex-direction: column;
  background: var(--page-soft);
  border-right: 1px solid var(--line);
  padding: 16px 12px;
  gap: 8px;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px 16px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 8px;
}
.sidebar-brand-logo {
  font-family: var(--brand);
  font-size: 22px;
  background: var(--metal-gradient);
  background-size: 230% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 4.4s linear infinite;
}
.sidebar-brand-badge {
  font-size: 9px; font-weight: 700;
  padding: 2px 6px; border-radius: 4px;
  background: var(--purple); color: #fff;
  letter-spacing: 0.1em;
}
.new-chat-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 12px;
  border-radius: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 13px; font-weight: 500;
  transition: all 160ms var(--ease);
}
.new-chat-btn:hover { background: var(--card-2); border-color: var(--purple); }
.sidebar-section {
  margin-top: 16px;
  font-size: 10px; font-weight: 700;
  color: var(--text-dim);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0 10px;
}
.chat-list { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.chat-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  font-size: 13px; color: var(--text-soft);
  cursor: pointer;
  transition: background 140ms var(--ease);
}
.chat-item:hover { background: var(--card); color: var(--text); }
.chat-item.active { background: var(--card-2); color: var(--text); }
.chat-item-icon { color: var(--text-dim); }
.sidebar-footer {
  margin-top: auto;
  padding: 10px;
  border-top: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: 10px;
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--purple); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
}
.sidebar-user-info { flex: 1; min-width: 0; }
.sidebar-user-info strong { display: block; font-size: 13px; font-weight: 600; }
.sidebar-user-info small { display: block; font-size: 11px; color: var(--text-dim); }
.back-btn {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim);
  transition: all 140ms var(--ease);
}
.back-btn:hover { background: var(--card); color: var(--text); }

/* MAIN */
.main {
  display: flex; flex-direction: column;
  background: var(--page);
  overflow: hidden;
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line-soft);
  min-height: 56px;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-soft); }
.breadcrumb strong { color: var(--text); font-weight: 500; }
.topbar-actions { display: flex; gap: 8px; }
.topbar-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 8px;
  font-size: 12px; font-weight: 500;
  border: 1px solid var(--line);
  color: var(--text-soft);
  transition: all 140ms var(--ease);
}
.topbar-btn:hover { background: var(--card); color: var(--text); }
.topbar-btn.primary { background: var(--purple); color: #fff; border-color: transparent; }
.topbar-btn.primary:hover { filter: brightness(1.1); }

/* CONTENT */
.content {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

/* EMPTY STATE */
.empty-state {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px;
  text-align: center;
  animation: fadeUp 600ms var(--ease) both;
}
.greeting {
  font-size: clamp(32px, 5vw, 48px);
  font-weight: 600;
  letter-spacing: -0.03em;
  margin: 0 0 8px;
  background: var(--metal-gradient);
  background-size: 230% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 4.4s linear infinite;
}
.subtitle {
  font-size: clamp(16px, 2vw, 20px);
  color: var(--text-soft);
  margin: 0 0 40px;
  font-weight: 400;
}
.suggestions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 280px));
  gap: 12px;
  max-width: 600px;
  width: 100%;
}
.suggestion-card {
  display: flex; flex-direction: column;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  text-align: left;
  transition: all 180ms var(--ease);
  cursor: pointer;
}
.suggestion-card:hover {
  border-color: var(--purple);
  background: var(--card-2);
  transform: translateY(-2px);
}
.suggestion-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: rgba(140,122,255,0.12);
  color: var(--purple);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 10px;
  font-size: 16px;
}
.suggestion-card strong { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.suggestion-card small { font-size: 12px; color: var(--text-dim); line-height: 1.4; }

/* COMPOSER */
.composer-dock {
  padding: 16px 24px 24px;
  background: linear-gradient(to top, var(--page) 40%, transparent);
}
.composer {
  max-width: 760px;
  margin: 0 auto;
  width: 100%;
}
.composer-box {
  position: relative;
  display: flex; align-items: flex-end;
  min-height: 120px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--card);
  box-shadow: 0 8px 34px rgba(0,0,0,0.3);
  transition: all 180ms var(--ease);
}
.composer-box:focus-within {
  border-color: var(--purple);
  box-shadow: 0 8px 34px rgba(0,0,0,0.3), 0 0 0 4px rgba(140,122,255,0.12);
}
.message-input {
  flex: 1;
  min-height: 120px; max-height: 240px;
  padding: 20px 80px 20px 56px;
  resize: none;
  border: 0; outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 16px; line-height: 1.5;
  font-family: var(--sans);
}
.message-input::placeholder { color: var(--text-dim); }
.attach-btn {
  position: absolute; left: 14px; bottom: 14px;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--card-2);
  border: 1px solid var(--line);
  color: var(--text-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 300;
  transition: all 140ms var(--ease);
}
.attach-btn:hover { background: var(--card-3); color: var(--text); }
.send-btn {
  position: absolute; right: 14px; bottom: 14px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--purple);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: all 160ms var(--ease);
}
.send-btn:hover:not(:disabled) { filter: brightness(1.15); transform: scale(1.05); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.composer-caption {
  margin: 10px 0 0;
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
}

/* MESSAGES */
.message-list {
  display: flex; flex-direction: column;
  gap: 24px;
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
  padding: 32px 24px 160px;
}
.message-row { display: flex; flex-direction: column; animation: fadeUp 300ms var(--ease) both; }
.message-row.user { align-items: flex-end; }
.message-row.assistant { align-items: flex-start; }
.message-bubble {
  padding: 14px 18px;
  border-radius: 18px;
  background: var(--card-2);
  font-size: 15px; line-height: 1.55;
  max-width: 80%;
}
.message-row.user .message-bubble {
  background: var(--purple);
  color: #fff;
  border-bottom-right-radius: 6px;
}
.assistant-response { display: flex; gap: 12px; max-width: 100%; }
.assistant-marker {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--card-2);
  display: flex; align-items: center; justify-content: center;
  color: var(--purple);
  flex-shrink: 0;
}
.assistant-content { flex: 1; min-width: 0; font-size: 15px; line-height: 1.6; color: var(--text-soft); }
.assistant-content p { margin: 0 0 10px; }
.assistant-content strong { color: var(--text); }
.assistant-content code {
  padding: 2px 6px; border-radius: 5px;
  background: var(--card-2); border: 1px solid var(--line-soft);
  font-size: 0.9em; color: var(--text);
}
.code-block {
  margin: 12px 0;
  border: 1px solid rgba(140,122,255,0.25);
  border-radius: 12px;
  background: #0c0c10;
  overflow: hidden;
}
.code-block-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px;
  background: linear-gradient(90deg, rgba(140,122,255,0.1), transparent);
  border-bottom: 1px solid var(--line-soft);
  font-size: 11px; font-weight: 600;
  color: #c9c5ff;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.code-copy {
  padding: 4px 10px; border-radius: 6px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--line-soft);
  color: #d7d7dd;
  font-size: 11px;
}
.code-copy:hover { background: rgba(140,122,255,0.2); color: #fff; }
.code-block pre {
  margin: 0; padding: 14px;
  overflow-x: auto;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 13px; line-height: 1.6;
  color: #f5f5f7;
}

/* THINKING */
.thinking-row { display: flex; align-items: center; gap: 10px; color: var(--text-soft); font-size: 15px; }
.thinking-dots { display: inline-flex; gap: 4px; }
.thinking-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--purple);
  animation: bounce 1.2s infinite ease-in-out;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.3s; }

@keyframes shine { from { background-position: 230% center; } to { background-position: -30% center; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .suggestions { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-brand-logo">KAZER</span>
      <span class="sidebar-brand-badge">CODER</span>
    </div>
    <button class="new-chat-btn" id="newChatBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Nova conversa
    </button>
    <div class="sidebar-section">Recentes</div>
    <div class="chat-list" id="chatList">
      <div class="chat-item active">
        <svg class="icon chat-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Nova conversa</span>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="avatar" id="userAvatar">K</div>
      <div class="sidebar-user-info">
        <strong id="userName">Usuário</strong>
        <small id="userEmail">carregando...</small>
      </div>
      <button class="back-btn" id="backBtn" title="Voltar ao KAZER">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb">
          <span>KAZER CODER</span>
          <span>/</span>
          <strong id="projectName">Nova conversa</strong>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="topbar-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Run
        </button>
        <button class="topbar-btn primary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>
          Deploy
        </button>
      </div>
    </header>

    <div class="content" id="content">
      <!-- EMPTY STATE -->
      <section class="empty-state" id="emptyState">
        <h1 class="greeting" id="greeting">Olá 👋</h1>
        <p class="subtitle">O que vamos criar hoje?</p>
        <div class="suggestions">
          <button class="suggestion-card" data-prompt="Crie uma landing page moderna com hero, features e CTA">
            <div class="suggestion-icon">✨</div>
            <strong>Landing page</strong>
            <small>Crie uma página moderna com hero, features e CTA</small>
          </button>
          <button class="suggestion-card" data-prompt="Refatore este código para melhorar performance e legibilidade">
            <div class="suggestion-icon">⚡</div>
            <strong>Refatorar código</strong>
            <small>Melhore performance e legibilidade</small>
          </button>
          <button class="suggestion-card" data-prompt="Explique este bug e sugira uma solução">
            <div class="suggestion-icon">🐛</div>
            <strong>Debugar problema</strong>
            <small>Explique bugs e sugira soluções</small>
          </button>
          <button class="suggestion-card" data-prompt="Crie uma API REST com Node.js e Express">
            <div class="suggestion-icon">🚀</div>
            <strong>Criar API</strong>
            <small>Monte uma API REST completa</small>
          </button>
        </div>
      </section>

      <!-- MESSAGE LIST -->
      <section class="message-list" id="messageList" hidden></section>
    </div>

    <!-- COMPOSER -->
    <div class="composer-dock">
      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-box">
          <button class="attach-btn" type="button" title="Anexar arquivo">+</button>
          <textarea class="message-input" id="messageInput" rows="1" placeholder="Peça ao KAZER para codar algo..."></textarea>
          <button class="send-btn" id="sendBtn" type="submit" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <p class="composer-caption">KAZER CODER · seu par de programação inteligente</p>
      </form>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = "https://mqjunopzycdezzjmlhip.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xanVub3B6eWNkZXp6am1saGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4Mzg3NDksImV4cCI6MjEwMzQxNDc0OX0.Y_o2_QQhZzuCjvHdEfxaR5VrAxo7NFenPaDmdHN3bwM";
  const supa = window.supabase?.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  const greeting = $("greeting");
  const userName = $("userName");
  const userEmail = $("userEmail");
  const userAvatar = $("userAvatar");
  const messageInput = $("messageInput");
  const sendBtn = $("sendBtn");
  const composer = $("composer");
  const messageList = $("messageList");
  const emptyState = $("emptyState");
  const content = $("content");

  let messages = [];
  let busy = false;

  // LOAD USER
  const loadUser = async () => {
    if (!supa) { window.location.assign("/login"); return; }
    const { data: { session } } = await supa.auth.getSession();
    if (!session) { window.location.assign("/login"); return; }
    const user = session.user;
    const name = user.user_metadata?.display_name || user.email?.split("@")[0] || "Dev";
    const email = user.email || "";
    const initial = name.trim().charAt(0).toUpperCase();
    greeting.textContent = `Olá, ${name} 👋`;
    userName.textContent = name;
    userEmail.textContent = email;
    userAvatar.textContent = initial;
  };

  // INPUT
  const updateSend = () => {
    sendBtn.disabled = busy || messageInput.value.trim().length === 0;
  };
  messageInput.addEventListener("input", () => {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 240) + "px";
    updateSend();
  });
  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });

  // SUGGESTIONS
  document.querySelectorAll(".suggestion-card").forEach(card => {
    card.addEventListener("click", () => {
      messageInput.value = card.dataset.prompt || "";
      messageInput.focus();
      updateSend();
    });
  });

  // RENDER
  const escapeHtml = (s) => String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const timeNow = () => new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit"}).format(new Date());

  const renderCodeBlock = (lang, code) => {
    return `<div class="code-block">
      <div class="code-block-head">
        <span>${escapeHtml(lang||"code")}</span>
        <button class="code-copy" onclick="navigator.clipboard.writeText(this.closest('.code-block').querySelector('pre').textContent);this.textContent='Copiado';setTimeout(()=>this.textContent='Copiar',1500)">Copiar</button>
      </div>
      <pre><code>${escapeHtml(code)}</code></pre>
    </div>`;
  };

  const renderMarkdown = (text) => {
    let html = escapeHtml(text);
    html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (_, lang, code) => renderCodeBlock(lang, code));
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/\n/g, "<br>");
    return html;
  };

  const createUserMsg = (text) => {
    const row = document.createElement("div");
    row.className = "message-row user";
    row.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
    return row;
  };

  const createAssistantMsg = (text) => {
    const row = document.createElement("div");
    row.className = "message-row assistant";
    row.innerHTML = `
      <div class="assistant-response">
        <div class="assistant-marker">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 13.8 10.2 21.4 12l-7.6 1.8L12 22l-1.8-7.6L2.6 12l7.6-1.8L12 2Z"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/></svg>
        </div>
        <div class="assistant-content">${renderMarkdown(text)}</div>
      </div>`;
    return row;
  };

  const createThinking = () => {
    const row = document.createElement("div");
    row.className = "message-row assistant";
    row.id = "thinkingRow";
    row.innerHTML = `
      <div class="thinking-row">
        <div class="assistant-marker">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 13.8 10.2 21.4 12l-7.6 1.8L12 22l-1.8-7.6L2.6 12l7.6-1.8L12 2Z"/></svg>
        </div>
        <span>Pensando</span>
        <div class="thinking-dots"><span></span><span></span><span></span></div>
      </div>`;
    return row;
  };

  const enterConversation = () => {
    emptyState.hidden = true;
    messageList.hidden = false;
  };

  const scrollBottom = () => {
    requestAnimationFrame(() => content.scrollTo({ top: content.scrollHeight, behavior: "smooth" }));
  };

  // SUBMIT
  const submit = async () => {
    if (busy) return;
    const text = messageInput.value.trim();
    if (!text) return;
    enterConversation();
    messageList.appendChild(createUserMsg(text));
    messages.push({ role: "user", content: text });
    messageInput.value = "";
    messageInput.style.height = "auto";
    updateSend();
    scrollBottom();

    const thinking = createThinking();
    messageList.appendChild(thinking);
    scrollBottom();
    busy = true;
    updateSend();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erro na resposta");
      const answer = data.message?.content || "Sem resposta.";
      thinking.remove();
      messageList.appendChild(createAssistantMsg(answer));
      messages.push({ role: "assistant", content: answer });
      scrollBottom();
    } catch (err) {
      thinking.remove();
      messageList.appendChild(createAssistantMsg("⚠️ " + (err.message || "Não foi possível conectar.")));
      scrollBottom();
    } finally {
      busy = false;
      updateSend();
      messageInput.focus();
    }
  };

  composer.addEventListener("submit", (e) => { e.preventDefault(); submit(); });

  // NEW CHAT
  $("newChatBtn").addEventListener("click", () => {
    messages = [];
    messageList.replaceChildren();
    messageList.hidden = true;
    emptyState.hidden = false;
    messageInput.value = "";
    updateSend();
  });

  // BACK
  $("backBtn").addEventListener("click", () => {
    const inInterface = window.location.pathname.includes("/interface/");
    window.location.assign(inInterface ? "../interface/index.html" : "/interface/");
  });

  loadUser();
  updateSend();
})();
</script>
</body>
</html>
