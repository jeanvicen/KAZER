<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KAZER CODER</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#070707;color:#f0f0f0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18)}

.gradient-metal{
  background:linear-gradient(135deg,#e8e0ff 0%,#a89fff 20%,#fff 40%,#8c7aff 60%,#c4beff 80%,#f0ecff 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  background-size:200% 200%;animation:shimmer 4s ease-in-out infinite
}
@keyframes shimmer{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}

.logo-pulse{animation:logoPulse 3s cubic-bezier(.4,0,.6,1) infinite}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 12px rgba(140,122,255,.4))}50%{filter:drop-shadow(0 0 28px rgba(140,122,255,.75))}}

.fade-in{animation:fadeIn .45s cubic-bezier(.22,1,.36,1) both}
.d1{animation-delay:.07s}.d2{animation-delay:.14s}.d3{animation-delay:.21s}.d4{animation-delay:.28s}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.msg-in{animation:msgIn .3s cubic-bezier(.22,1,.36,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Thinking Animation (Cursor Style) */
.thinking-row{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:#0f0f10;border:1px solid rgba(255,255,255,.06)}
.thinking-symbol{width:18px;height:18px;color:#8c7aff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.thinking-symbol svg{width:18px;height:18px;animation:thinking-spin 2.4s cubic-bezier(.4,0,.2,1) infinite;filter:drop-shadow(0 0 8px rgba(140,122,255,.5))}
@keyframes thinking-spin{0%,100%{transform:rotate(0deg) scale(.92);opacity:.7}50%{transform:rotate(180deg) scale(1.08);opacity:1}}
.thinking-label{font-size:13px;font-weight:500;color:transparent;background:linear-gradient(90deg,#a7a7ab,#f8f8f8,#a7a7ab);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;animation:text-shimmer 1.8s linear infinite;letter-spacing:-.01em}
@keyframes text-shimmer{from{background-position:200% center}to{background-position:-200% center}}

.cursor-blink{display:inline-block;width:8px;height:15px;background:#8c7aff;margin-left:2px;vertical-align:text-bottom;animation:cursorB 1s step-end infinite}
@keyframes cursorB{0%,100%{opacity:1}50%{opacity:0}}

#app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
#sidebar{width:260px;flex-shrink:0;display:flex;flex-direction:column;background:#0a0a0b;border-right:1px solid rgba(255,255,255,.05)}
.sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo-icon{width:32px;height:32px;border-radius:9px;background:rgba(140,122,255,.12);border:1px solid rgba(140,122,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-text{font-family:'UnifrakturMaguntia',cursive;font-size:20px;line-height:1;background:linear-gradient(135deg,#e8e0ff,#8c7aff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:9.5px;color:#5a5a62;letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.btn-new{width:100%;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:rgba(140,122,255,.1);border:1px solid rgba(140,122,255,.2);cursor:pointer;color:#c4beff;font-size:13px;font-family:'Inter',sans-serif;font-weight:500;transition:background .15s}
.btn-new:hover{background:rgba(140,122,255,.2)}

.sidebar-body{flex:1;overflow-y:auto;padding:12px 8px}
.section-label{font-size:10px;color:#3a3a42;padding:6px 8px 6px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}

.file-row{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;color:#9090a0;font-size:12.5px;transition:background .1s;font-family:'JetBrains Mono',monospace}
.file-row:hover{background:rgba(255,255,255,.04);color:#c0c0cc}
.file-row.folder{color:#c0c0cc;font-family:'Inter',sans-serif;font-weight:500}

.sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#8c7aff,#4a38cc);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;color:#fff}
.user-info{flex:1;min-width:0}
.user-name{color:#c0c0cc;font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-plan{color:#4a4a52;font-size:11px}
.icon-btn{background:transparent;border:none;cursor:pointer;color:#4a4a52;padding:4px;display:flex;align-items:center}
.icon-btn:hover{color:#c0c0cc}

/* Main */
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* Topbar */
#topbar{height:46px;flex-shrink:0;display:flex;align-items:center;border-bottom:1px solid rgba(255,255,255,.05);background:#08080a;padding:0 16px;gap:0}
.breadcrumb{display:flex;align-items:center;gap:6px;color:#5a5a62;font-size:12px;margin-right:20px;flex-shrink:0}
.breadcrumb span{color:#3a3a42}
.breadcrumb em{color:#8a8a8e;font-style:normal}
.file-tabs{display:flex;align-items:stretch;flex:1;gap:0;overflow-x:auto;height:100%}
.ftab{display:flex;align-items:center;gap:6px;padding:0 14px;background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;color:#5a5a62;font-size:12.5px;font-family:'Inter',sans-serif;white-space:nowrap;transition:color .15s;margin-bottom:-1px}
.ftab.active{color:#e0e0f0;border-bottom-color:#8c7aff}
.topbar-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.top-btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);cursor:pointer;color:#8a8a8e;font-size:12px;font-family:'Inter',sans-serif;transition:all .15s}
.top-btn:hover{background:rgba(255,255,255,.08);color:#e0e0ee}
.top-btn.accent{background:rgba(140,122,255,.15);border-color:rgba(140,122,255,.3);color:#c4beff}
.top-btn.accent:hover{background:rgba(140,122,255,.25)}

/* Content */
#content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* Empty state */
#empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:0 24px 40px}
.empty-logo{margin-bottom:28px}
.empty-h1{font-size:38px;font-weight:700;letter-spacing:-.03em;text-align:center}
.empty-sub{color:#8a8a8e;font-size:17px;margin-top:10px;margin-bottom:36px;text-align:center;max-width:420px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;width:100%;max-width:660px}
.sug-card{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;background:#0f0f10;border:1px solid rgba(255,255,255,.07);cursor:pointer;text-align:left;transition:all .2s cubic-bezier(.22,1,.36,1);width:100%}
.sug-card:hover{border-color:rgba(140,122,255,.4);background:rgba(140,122,255,.08);transform:translateY(-2px);box-shadow:0 8px 24px rgba(140,122,255,.12)}
.sug-icon{font-size:18px;line-height:1;flex-shrink:0;margin-top:1px}
.sug-label{color:#e0e0e8;font-size:13.5px;font-weight:500;margin-bottom:3px}
.sug-desc{color:#5a5a62;font-size:12px}
.empty-footer{color:#2e2e36;font-size:12px;margin-top:32px;text-align:center}

/* Composer */
.composer-wrap{background:#111113;border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:14px 16px;transition:border-color .2s,box-shadow .2s;width:100%;max-width:660px}
.composer-wrap.compact{border-radius:16px;padding:10px 14px}
.composer-wrap:focus-within{border-color:rgba(140,122,255,.4);box-shadow:0 0 0 1px rgba(140,122,255,.2),0 8px 32px rgba(140,122,255,.1)}
.composer-textarea{width:100%;background:transparent;border:none;outline:none;resize:none;color:#f0f0f0;font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;min-height:24px;max-height:180px;overflow:hidden}
.composer-wrap.compact .composer-textarea{font-size:13.5px}
.composer-textarea::placeholder{color:#4a4a50}
.composer-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.attach-btn{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer;color:#8a8a8e;font-size:12px;font-family:'Inter',sans-serif;transition:all .15s}
.attach-btn:hover{color:#c0c0cc;background:rgba(255,255,255,.07)}
.composer-right{display:flex;align-items:center;gap:8px}
.hint{font-size:11px;color:#4a4a50}
.send-btn{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s cubic-bezier(.22,1,.36,1)}
.send-btn.active{background:#8c7aff;color:#fff}
.send-btn.active:hover{background:#a090ff;box-shadow:0 0 20px rgba(140,122,255,.5);transform:scale(1.05)}
.send-btn.active:active{transform:scale(.95)}
.send-btn.inactive{background:rgba(140,122,255,.2);color:#8c7aff;cursor:not-allowed;opacity:.5}

/* Chat */
#chat-view{display:none;flex:1;flex-direction:column;overflow:hidden}
#chat-area{flex:1;overflow-y:auto;padding:20px 28px;display:flex;flex-direction:column;gap:20px}
.msg-wrap{display:flex;gap:12px;align-items:flex-start}
.msg-wrap.user{flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;border-radius:50%;background:rgba(140,122,255,.12);border:1px solid rgba(140,122,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.msg-body{max-width:85%;display:flex;flex-direction:column;gap:6px}
.msg-bubble{padding:11px 15px;font-size:14px;line-height:1.65;font-family:'Inter',sans-serif}
.msg-bubble.assistant{border-radius:18px 18px 18px 4px;background:#111113;border:1px solid rgba(255,255,255,.06);color:#e8e8f0}
.msg-bubble.user{border-radius:18px 18px 4px 18px;background:rgba(140,122,255,.18);border:1px solid rgba(140,122,255,.3);color:#e8e8f0}
.msg-ts{font-size:10.5px;color:#3a3a42;font-family:'Inter',sans-serif}
.msg-wrap.user .msg-ts{text-align:right}
.msg-wrap.assistant .msg-ts{padding-left:4px}

/* Code block */
.code-block{background:#0a0a0b;border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden;margin-top:8px;box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.04)}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.06);background:linear-gradient(90deg,rgba(140,122,255,.1),rgba(255,255,255,.02))}
.code-lang{font-family:'JetBrains Mono',monospace;font-size:11px;color:#c9c5ff;letter-spacing:.05em;display:inline-flex;align-items:center;gap:7px}
.code-lang::before{content:"";width:6px;height:6px;border-radius:50%;background:#8c7aff;box-shadow:0 0 10px rgba(140,122,255,.85)}
.code-lang.is-writing::before{animation:code-dot-pulse 900ms ease-in-out infinite}
@keyframes code-dot-pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.copy-btn{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);cursor:pointer;color:#d7d7dd;font-size:11px;font-family:'Inter',sans-serif;transition:all .2s}
.copy-btn:hover:not(:disabled){background:rgba(140,122,255,.2);color:#fff;border-color:rgba(140,122,255,.5)}
.copy-btn:disabled{cursor:wait;opacity:.45}
.copy-btn.copied{color:#7affb8;background:rgba(122,255,184,.1);border-color:rgba(122,255,184,.3)}
pre.code-pre{margin:0;padding:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;overflow-x:auto;color:#f5f5f7;tab-size:2}
pre.code-pre.is-streaming::after{content:"▋";display:inline-block;color:#8c7aff;animation:cursorB 1s steps(2) infinite;margin-left:2px}

/* Terminal */
#terminal{height:180px;flex-shrink:0;border-top:1px solid rgba(255,255,255,.05);background:#060608;display:none;flex-direction:column}
.term-header{display:flex;align-items:center;padding:0 14px;height:34px;border-bottom:1px solid rgba(255,255,255,.05);gap:8px}
.term-title{color:#8a8a8e;font-size:12px;font-family:'Inter',sans-serif;flex:1}
.term-close{background:transparent;border:none;cursor:pointer;color:#4a4a52;font-size:18px;line-height:1;padding:0 4px}
.term-close:hover{color:#f0f0f0}
.term-body{flex:1;overflow-y:auto;padding:10px 16px}
.term-line{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#9090a0}

svg{display:block}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-row">
        <div class="logo-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M4 4l8 8-8 8M12 4l8 8-8 8" stroke="url(#km1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="km1" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#c4beff"/><stop offset="1" stop-color="#8c7aff"/></linearGradient></defs>
          </svg>
        </div>
        <div>
          <div class="logo-text">KAZER</div>
          <div class="logo-sub">CODER</div>
        </div>
      </div>
      <button class="btn-new" id="btn-new">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Nova conversa
      </button>
    </div>

    <div class="sidebar-body">
      <div class="section-label">Explorer</div>
      <div class="file-row folder" data-folder="src">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 6.5l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M1 5h14v8a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V5zm0 0V4a1 1 0 0 1 1-1h4l2 2h7" stroke="#ffcb6b" stroke-width="1.2"/></svg>
        <span>src</span>
      </div>
      <div id="src-children">
        <div class="file-row" style="padding-left:22px">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M9 1H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6L9 1z" stroke="#82aaff" stroke-width="1.2"/><path d="M9 1v5h5" stroke="#82aaff" stroke-width="1.2"/></svg>
          <span>App.tsx</span>
        </div>
        <div class="file-row" style="padding-left:22px">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M9 1H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6L9 1z" stroke="#c792ea" stroke-width="1.2"/><path d="M9 1v5h5" stroke="#c792ea" stroke-width="1.2"/></svg>
          <span>index.css</span>
        </div>
      </div>
      <div class="file-row">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M9 1H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6L9 1z" stroke="#c3e88d" stroke-width="1.2"/><path d="M9 1v5h5" stroke="#c3e88d" stroke-width="1.2"/></svg>
        <span>package.json</span>
      </div>
    </div>

    <div class="sidebar-user">
      <div class="user-avatar">D</div>
      <div class="user-info">
        <div class="user-name">Dev User</div>
        <div class="user-plan">Pro plan ✦</div>
      </div>
      <button class="icon-btn" title="Configurações">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div class="breadcrumb">
        <span>meu-projeto</span>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M3.5 2l3 3-3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <em>src</em>
      </div>
      <div class="file-tabs">
        <button class="ftab active">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M9 1H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6L9 1z" stroke="#82aaff" stroke-width="1.2"/><path d="M9 1v5h5" stroke="#82aaff" stroke-width="1.2"/></svg>
          App.tsx
        </button>
        <button class="ftab">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M9 1H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6L9 1z" stroke="#c792ea" stroke-width="1.2"/><path d="M9 1v5h5" stroke="#c792ea" stroke-width="1.2"/></svg>
          index.css
        </button>
      </div>
      <div class="topbar-actions">
        <button class="top-btn accent">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4 2l10 6-10 6V2z" fill="currentColor"/></svg>
          Run
        </button>
        <button class="top-btn">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 2v8M5 7l3-5 3 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 12h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          Deploy
        </button>
        <button class="top-btn" id="btn-terminal">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M4 6l3 2.5L4 11M9 11h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Terminal
        </button>
      </div>
    </div>

    <div id="content">
      <div id="empty">
        <div class="empty-logo logo-pulse fade-in">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
            <rect width="64" height="64" rx="18" fill="url(#bg_l)" opacity="0.15"/>
            <rect width="64" height="64" rx="18" stroke="url(#bo_l)" stroke-width="1"/>
            <path d="M14 14l18 18-18 18M32 14l18 18-18 18" stroke="url(#mk_l)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="bg_l" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#8c7aff"/><stop offset="1" stop-color="#4a38cc"/></linearGradient>
              <linearGradient id="bo_l" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop stop-color="#c4beff" stop-opacity="0.5"/><stop offset="1" stop-color="#8c7aff" stop-opacity="0.2"/></linearGradient>
              <linearGradient id="mk_l" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="0.5" stop-color="#c4beff"/><stop offset="1" stop-color="#8c7aff"/></linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="empty-h1 gradient-metal fade-in d1">Olá, Dev 👋</h1>
        <p class="empty-sub fade-in d2">O que vamos criar hoje?</p>
        <div style="width:100%;max-width:660px" class="fade-in d3">
          <div class="composer-wrap" id="composer-empty">
            <textarea class="composer-textarea" id="ta-empty" rows="1" placeholder="Peça ao KAZER para codar algo..."></textarea>
            <div class="composer-footer">
              <button class="attach-btn">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M13.5 7.5l-6 6a4 4 0 0 1-5.66-5.66l6.36-6.36a2.5 2.5 0 0 1 3.54 3.54L5.4 11.36a1 1 0 0 1-1.41-1.41l6-6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                Anexar
              </button>
              <div class="composer-right">
                <span class="hint">Enter para enviar</span>
                <button class="send-btn inactive" id="send-empty">
                  <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M14 8L2 2l3 6-3 6 12-6z" fill="currentColor"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="suggestions fade-in d4">
          <button class="sug-card" data-msg="Crie uma landing page moderna com hero e CTA">
            <span class="sug-icon" style="color:#8c7aff">✦</span>
            <div><div class="sug-label">Landing page</div><div class="sug-desc">Hero, features e footer responsivo</div></div>
          </button>
          <button class="sug-card" data-msg="Refatore este código para melhorar performance">
            <span class="sug-icon" style="color:#7abaff">⟳</span>
            <div><div class="sug-label">Refatorar código</div><div class="sug-desc">Limpar e otimizar componentes</div></div>
          </button>
          <button class="sug-card" data-msg="Explique este bug e sugira uma solução">
            <span class="sug-icon" style="color:#ff7ab0">⚡</span>
            <div><div class="sug-label">Debugar problema</div><div class="sug-desc">Diagnose e corrija erros</div></div>
          </button>
          <button class="sug-card" data-msg="Crie uma API REST com Node.js e Express">
            <span class="sug-icon" style="color:#7affb8">◈</span>
            <div><div class="sug-label">Criar API</div><div class="sug-desc">Endpoints com validação Zod</div></div>
          </button>
        </div>
        <p class="empty-footer">KAZER organiza seu próximo código ✦</p>
      </div>

      <div id="chat-view">
        <div id="chat-area"></div>
        <div id="composer-bar" style="padding:12px 24px 16px;border-top:1px solid rgba(255,255,255,.04);background:rgba(7,7,7,.8);backdrop-filter:blur(8px)">
          <div class="composer-wrap compact" id="composer-chat">
            <textarea class="composer-textarea" id="ta-chat" rows="1" placeholder="Mensagem para KAZER..."></textarea>
            <div class="composer-footer">
              <button class="attach-btn">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M13.5 7.5l-6 6a4 4 0 0 1-5.66-5.66l6.36-6.36a2.5 2.5 0 0 1 3.54 3.54L5.4 11.36a1 1 0 0 1-1.41-1.41l6-6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                Anexar
              </button>
              <div class="composer-right">
                <span class="hint">Enter para enviar</span>
                <button class="send-btn inactive" id="send-chat">
                  <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M14 8L2 2l3 6-3 6 12-6z" fill="currentColor"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="terminal">
      <div class="term-header">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" style="color:#8a8a8e"><rect x="1" y="2" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M4 6l3 2.5L4 11M9 11h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="term-title">Terminal</span>
        <button class="term-close" id="term-close">×</button>
      </div>
      <div class="term-body">
        <div class="term-line"><span style="color:#8c7aff">$ </span>pnpm dev</div>
        <div class="term-line" style="color:#c3e88d">  VITE v8.0.4  ready in 312 ms</div>
        <div class="term-line" style="color:#89ddff">  ➜  Local:   http://localhost:8443/</div>
        <div class="term-line"><span style="color:#8c7aff">$ </span><span class="cursor-blink"></span></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let messages = [];
let busy = false;
let activeController = null;

// ── Helpers ────────────────────────────────────────────────────────────────────
function now() {
  return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const codeLangLabels = {js:"JavaScript",ts:"TypeScript",tsx:"TSX",jsx:"JSX",py:"Python",html:"HTML",css:"CSS",json:"JSON",bash:"Bash",sql:"SQL",md:"Markdown"};
function codeLangLabel(v) {
  const n = String(v||"").trim().toLowerCase();
  return codeLangLabels[n] || (n ? n.toUpperCase() : "CODE");
}

function kazerMark(size=15) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none">
    <path d="M4 4l8 8-8 8M12 4l8 8-8 8" stroke="url(#kmi)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <defs><linearGradient id="kmi" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse"><stop stop-color="#c4beff"/><stop offset="1" stop-color="#8c7aff"/></linearGradient></defs>
  </svg>`;
}

// Parser de segmentos (Markdown + Code blocks)
function parseSegments(text) {
  const lines = String(text||"").replace(/\r\n?/g, "\n").split("\n");
  const segments = [];
  let mdLines = [];
  let codeLines = null;
  let fenceType = null;
  let fenceLen = 0;
  let lang = "";

  const flushMd = () => {
    if (mdLines.length) {
      segments.push({ type: "md", text: mdLines.join("\n") });
      mdLines = [];
    }
  };

  for (const line of lines) {
    const open = line.match(/^\s{0,3}(`{3,}|~{3,})\s*([^\s`~]*)?\s*$/);
    if (!fenceType && open) {
      flushMd();
      fenceType = open[1][0];
      fenceLen = open[1].length;
      lang = (open[2] || "").trim();
      codeLines = [];
      continue;
    }
    if (fenceType) {
      const t = line.trim();
      const close = fenceType.repeat(fenceLen);
      if (t.length >= fenceLen && t.startsWith(close) && t.slice(fenceLen).trim() === "") {
        segments.push({ type: "code", lang, code: codeLines.join("\n"), complete: true });
        fenceType = null; codeLines = null; lang = "";
      } else {
        codeLines.push(line);
      }
      continue;
    }
    mdLines.push(line);
  }
  if (fenceType) {
    segments.push({ type: "code", lang, code: (codeLines||[]).join("\n"), complete: false });
  } else {
    flushMd();
  }
  return segments;
}

function renderAssistantContent(container, text, { writing = false } = {}) {
  container.replaceChildren();
  const segments = parseSegments(text);
  segments.forEach(seg => {
    if (seg.type === "code") {
      const block = document.createElement("div");
      block.className = "code-block";
      const head = document.createElement("div");
      head.className = "code-header";
      const label = document.createElement("span");
      label.className = "code-lang";
      label.textContent = writing && !seg.complete ? "Writing code…" : codeLangLabel(seg.lang);
      label.classList.toggle("is-writing", writing && !seg.complete);
      
      const copy = document.createElement("button");
      copy.className = "copy-btn";
      copy.textContent = writing && !seg.complete ? "Aguarde" : "Copiar";
      copy.disabled = writing || !seg.complete;
      copy.addEventListener("click", async () => {
        if (copy.disabled) return;
        try {
          await navigator.clipboard.writeText(seg.code);
          copy.textContent = "Copiado";
          copy.classList.add("copied");
          setTimeout(() => { if(copy.isConnected){ copy.textContent="Copiar"; copy.classList.remove("copied"); } }, 1500);
        } catch(e){}
      });
      head.append(label, copy);
      
      const pre = document.createElement("pre");
      if (writing && !seg.complete) pre.classList.add("is-streaming");
      const codeEl = document.createElement("code");
      codeEl.textContent = seg.code;
      pre.appendChild(codeEl);
      block.append(head, pre);
      container.appendChild(block);
    } else {
      // Markdown simples
      const div = document.createElement("div");
      let html = escapeHtml(seg.text);
      html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/`([^`\n]+)`/g, "<code style='padding:2px 5px;border-radius:4px;background:rgba(255,255,255,.06);font-family:JetBrains Mono,monospace;font-size:.9em'>$1</code>");
      html = html.replace(/\n/g, "<br>");
      div.innerHTML = `<p style="margin:0 0 8px 0">${html}</p>`;
      container.appendChild(div);
    }
  });
}

function scrollBottom() {
  const area = document.getElementById('chat-area');
  if (area) area.scrollTop = area.scrollHeight;
}

// ── UI Actions ─────────────────────────────────────────────────────────────────
function enterChat() {
  document.getElementById('empty').style.display = 'none';
  document.getElementById('chat-view').style.display = 'flex';
}

function appendUserMessage(text) {
  const area = document.getElementById('chat-area');
  const row = document.createElement("div");
  row.className = "msg-wrap user msg-in";
  row.innerHTML = `
    <div class="msg-body">
      <div class="msg-bubble user">${escapeHtml(text)}</div>
      <span class="msg-ts">${now()}</span>
    </div>`;
  area.appendChild(row);
  scrollBottom();
}

function appendThinking() {
  const area = document.getElementById('chat-area');
  const row = document.createElement("div");
  row.className = "msg-wrap assistant msg-in";
  row.id = "thinking-row";
  row.innerHTML = `
    <div class="msg-avatar">${kazerMark(15)}</div>
    <div class="thinking-row">
      <div class="thinking-symbol">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 13.8 10.2 21.4 12l-7.6 1.8L12 22l-1.8-7.6L2.6 12l7.6-1.8L12 2Z"/>
        </svg>
      </div>
      <span class="thinking-label">Pensando</span>
    </div>`;
  area.appendChild(row);
  scrollBottom();
  return row;
}

function appendAssistantMessage() {
  const area = document.getElementById('chat-area');
  const row = document.createElement("div");
  row.className = "msg-wrap assistant msg-in";
  row.innerHTML = `
    <div class="msg-avatar">${kazerMark(15)}</div>
    <div class="msg-body">
      <div class="msg-bubble assistant"><div class="assistant-content"></div></div>
      <span class="msg-ts">${now()}</span>
    </div>`;
  area.appendChild(row);
  scrollBottom();
  return row.querySelector(".assistant-content");
}

// ── Core Logic ─────────────────────────────────────────────────────────────────
async function submit(text) {
  if (!text.trim() || busy) return;
  
  enterChat();
  appendUserMessage(text);
  messages.push({ role: "user", content: text });
  
  const thinkingEl = appendThinking();
  busy = true;
  updateSendState();

  activeController = new AbortController();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages }),
      signal: activeController.signal
    });
    
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Erro na resposta da API");
    
    const answer = data.message?.content || data.response || "Sem resposta.";
    thinkingEl.remove();
    
    const contentEl = appendAssistantMessage();
    
    // Simulação de streaming suave para UX premium
    const total = answer.length;
    let idx = 0;
    while (idx < total) {
      if (activeController.signal.aborted) throw new DOMException("Interrompido", "AbortError");
      idx = Math.min(total, idx + Math.max(2, Math.ceil(total / 150)));
      renderAssistantContent(contentEl, answer.slice(0, idx), { writing: idx < total });
      scrollBottom();
      await new Promise(r => setTimeout(r, idx < total ? 16 : 0));
    }
    renderAssistantContent(contentEl, answer, { writing: false });
    messages.push({ role: "assistant", content: answer });
    
  } catch (err) {
    if (err.name === "AbortError") {
      thinkingEl.remove();
      const contentEl = appendAssistantMessage();
      contentEl.innerHTML = "<p>⚠️ Resposta interrompida.</p>";
      return;
    }
    thinkingEl.remove();
    const contentEl = appendAssistantMessage();
    contentEl.innerHTML = `<p style="color:#f07474">⚠️ ${escapeHtml(err.message || "Não foi possível conectar.")}</p>`;
  } finally {
    busy = false;
    activeController = null;
    updateSendState();
    document.getElementById('ta-chat').focus();
  }
}

function resetChat() {
  if (activeController) activeController.abort();
  messages = [];
  busy = false;
  document.getElementById('chat-area').innerHTML = '';
  document.getElementById('chat-view').style.display = 'none';
  document.getElementById('empty').style.display = 'flex';
  document.getElementById('ta-empty').value = '';
  document.getElementById('ta-chat').value = '';
  updateSendState();
}

function updateSendState() {
  const taEmpty = document.getElementById('ta-empty');
  const taChat = document.getElementById('ta-chat');
  const btnEmpty = document.getElementById('send-empty');
  const btnChat = document.getElementById('send-chat');
  
  const valEmpty = taEmpty.value.trim();
  const valChat = taChat.value.trim();
  
  btnEmpty.className = 'send-btn ' + ((valEmpty && !busy) ? 'active' : 'inactive');
  btnChat.className = 'send-btn ' + ((valChat && !busy) ? 'active' : 'inactive');
}

function setupComposer(taId, sendBtnId, isChat) {
  const ta = document.getElementById(taId);
  const btn = document.getElementById(sendBtnId);

  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 180) + 'px';
    updateSendState();
  });

  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const val = ta.value.trim();
      if (!val || busy) return;
      submit(val);
      ta.value = '';
      ta.style.height = 'auto';
      updateSendState();
    }
  });

  btn.addEventListener('click', () => {
    const val = ta.value.trim();
    if (!val || busy) return;
    submit(val);
    ta.value = '';
    ta.style.height = 'auto';
    updateSendState();
  });
}

// ── Init ───────────────────────────────────────────────────────────────────────
setupComposer('ta-empty', 'send-empty', false);
setupComposer('ta-chat', 'send-chat', true);

document.querySelectorAll('.sug-card').forEach(card => {
  card.addEventListener('click', () => {
    const msg = card.dataset.msg;
    document.getElementById('ta-empty').value = msg;
    updateSendState();
    submit(msg);
    document.getElementById('ta-empty').value = '';
    updateSendState();
  });
});

document.getElementById('btn-new').addEventListener('click', resetChat);

document.querySelector('[data-folder="src"]').addEventListener('click', function() {
  const children = document.getElementById('src-children');
  children.style.display = children.style.display === 'none' ? 'block' : 'none';
  const svg = this.querySelector('svg');
  svg.style.transform = children.style.display === 'none' ? 'rotate(0deg)' : 'rotate(90deg)';
  svg.style.transition = 'transform .2s';
});

document.getElementById('btn-terminal').addEventListener('click', () => {
  const term = document.getElementById('terminal');
  term.style.display = term.style.display === 'none' ? 'flex' : 'none';
});
document.getElementById('term-close').addEventListener('click', () => {
  document.getElementById('terminal').style.display = 'none';
});

document.querySelectorAll('.ftab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

updateSendState();
</script>
