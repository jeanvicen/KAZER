<!doctype html>
<html lang="en" class="is-booting">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#030303">
  <meta name="referrer" content="no-referrer">
  <title>KAZER</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/grenze-gotisch-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/kazer.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <canvas class="intro" id="intro" aria-hidden="true"></canvas>

  <main class="stage" id="stage">
    <section class="auth" id="auth" aria-labelledby="wordmark">
      <h1 class="wordmark" id="wordmark" data-text="KAZER">KAZER</h1>

      <div class="view" id="form-view">
        <div class="modes reveal" role="tablist" aria-label="Account access" id="modes" data-i="1">
          <button class="modes__tab" type="button" role="tab" id="tab-signin" data-mode="signin"
                  aria-selected="true" aria-controls="auth-form">Sign In</button>
          <button class="modes__tab" type="button" role="tab" id="tab-signup" data-mode="signup"
                  aria-selected="false" aria-controls="auth-form" tabindex="-1">Create Account</button>
          <span class="modes__rail" aria-hidden="true"></span>
        </div>

        <div class="heading reveal" id="heading" hidden>
          <h2 class="heading__title" id="heading-title" tabindex="-1"></h2>
          <p class="heading__lede" id="heading-lede"></p>
        </div>

        <form class="form" id="auth-form" role="tabpanel" aria-labelledby="tab-signin" novalidate>
          <div class="field reveal" data-field="email" data-i="2">
            <label class="field__label" for="email">Email</label>
            <input class="field__input" id="email" name="email" type="email" inputmode="email"
                   autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="254"
                   required aria-describedby="email-error">
            <p class="field__error" id="email-error"></p>
          </div>

          <div class="field reveal" data-field="password" data-i="3">
            <label class="field__label" for="password">Password</label>
            <input class="field__input" id="password" name="password" type="password"
                   autocomplete="current-password" maxlength="128" required
                   aria-describedby="password-hint password-error">
            <p class="field__hint" id="password-hint" hidden>At least 10 characters. A phrase works well.</p>
            <p class="field__error" id="password-error"></p>
          </div>

          <div class="field" data-field="confirm" hidden>
            <label class="field__label" for="confirm">Confirm password</label>
            <input class="field__input" id="confirm" name="confirm" type="password"
                   autocomplete="new-password" maxlength="128" aria-describedby="confirm-error">
            <p class="field__error" id="confirm-error"></p>
          </div>

          <div class="alert" id="form-alert" role="alert" hidden>
            <p class="alert__text" id="form-alert-text"></p>
            <button class="link alert__action" type="button" id="form-alert-action" hidden></button>
          </div>

          <div class="reveal" data-i="4">
            <button class="primary" type="submit" id="submit">
              <span class="primary__label" id="submit-label">Continue</span>
              <span class="primary__progress" aria-hidden="true"></span>
            </button>
          </div>

          <div class="links reveal" data-i="5">
            <button class="link" type="button" id="forgot">Forgot password?</button>
            <button class="link" type="button" id="switch"></button>
          </div>

          <p class="note" id="privacy-note" hidden>Your account stores only an email address and a password hash.</p>
        </form>
      </div>

      <div class="view notice" id="notice" hidden>
        <h2 class="notice__title" id="notice-title" tabindex="-1"></h2>
        <p class="notice__body" id="notice-body"></p>
        <p class="notice__status" id="notice-status" role="status"></p>
        <div class="notice__actions" id="notice-actions"></div>
      </div>
    </section>

    <section class="scene" id="scene" aria-hidden="true">
      <canvas class="scene__canvas" id="scene-canvas"></canvas>
    </section>
  </main>

  <noscript><p class="noscript">KAZER needs JavaScript enabled to sign in.</p></noscript>
</body>
</html>
