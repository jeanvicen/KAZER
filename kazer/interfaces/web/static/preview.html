<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia do KAZER</title>
<style>html,body{margin:0;height:100%;background:#0b0b0d}</style>
<script>
// Moldura isolada (sandbox sem allow-same-origin): recebe o HTML do KAZER por
// mensagem e o escreve aqui dentro. Não tem cookies, sessão nem acesso à API.
(function () {
  addEventListener("message", function (event) {
    if (event.source !== parent || !event.data || typeof event.data.kazerHtml !== "string") return;
    document.open();
    document.write(event.data.kazerHtml);
    document.close();
  });
  parent.postMessage({ kazerPreview: "ready" }, "*");
})();
</script>
</head>
<body></body>
</html>
