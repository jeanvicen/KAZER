[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kazer"
version = "0.1.0"
description = "Fundação modular e segura para um agente de IA extensível."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
kazer = "kazer.main:main"

[tool.setuptools.packages.find]
include = ["kazer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "."
