name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint e testes (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependências
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Painel de controle (controle-de-notificacao/controle.yaml)
        run: python scripts/controle.py
      - name: Testes (pytest)
        run: pytest -q

  sql:
    name: Migrações e testes SQL (Postgres local)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Postgres descartável, migrações do zero, RLS e corrida da cota
        run: |
          set +e
          bash scripts/pg_test.sh
          code=$?
          if [ "$code" = "77" ]; then
            echo "::warning::Testes SQL NÃO RODARAM: este executor não tem Postgres instalado."
            exit 0
          fi
          exit "$code"

  web:
    name: Sintaxe do front (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: node --check em todos os scripts
        run: |
          find kazer/interfaces/web/static -name '*.js' -print0 | xargs -0 -n1 node --check
