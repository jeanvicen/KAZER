name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build the background worker container
        run: docker build --tag kazer-background-worker:ci --file worker/Dockerfile .
      - name: Load worker and Skill assets inside the built container
        run: docker run --rm --entrypoint node kazer-background-worker:ci -e "require('./worker/background-worker'); const { loadAgentSkill } = require('./server/agent/_kazer-skills'); if (!loadAgentSkill('kazer-code')) throw new Error('worker Skill assets unavailable')"
      - name: Run unit and regression tests
        run: npm test
      - name: Run repository checks
        run: npm run check
      - name: Run isolated integration smoke tests
        run: npm run integration:test
      - name: Audit production dependencies
        run: npm run security:audit -- --audit-level=high
