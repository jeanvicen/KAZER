name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run unit and regression tests
        run: npm test
      - name: Run repository checks
        run: npm run check
      - name: Run isolated integration smoke tests
        run: npm run integration:test
      - name: Audit production dependencies
        run: npm run security:audit -- --audit-level=high

  mcp-approval-migration:
    name: Isolated MCP approval migration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify approval migration in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1
          -f test/mcp-approval-bootstrap.sql
          -f database/supabase/022_mcp_action_approvals.sql
          -f test/mcp-approval-assert.sql
