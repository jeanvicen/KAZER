name: Apply KAZ 1.1 low effort

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-kaz-low-effort.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restrict KAZ 1.1 to Baixo
        run: |
          python - <<'PY'
          from pathlib import Path
          provider = Path("kazer/brain/model_provider.py")
          text = provider.read_text()
          old = '            capabilities=Capabilities(\n                images=bool(vision_model),\n                efforts=tuple(level for level in EFFORTS if level in self._tiers),\n            ),'
          new = '            capabilities=Capabilities(\n                images=bool(vision_model),\n                # O KAZ 1.1 público oferece somente o modo Baixo.\n                efforts=("baixo",),\n            ),'
          if old not in text:
              raise SystemExit("Trecho de capacidades não encontrado")
          provider.write_text(text.replace(old, new, 1))

          tests = Path("tests/test_groq.py")
          text = tests.read_text()
          text = text.replace('assert built.capabilities.efforts == ("baixo", "medio", "alto", "extra", "max")', 'assert built.capabilities.efforts == ("baixo",)')
          text = text.replace('["baixo", "medio", "alto", "max"]', '["baixo"]')
          text = text.replace('"effort": "extra"', '"effort": "medio"')
          start = text.index('def test_chosen_effort_reaches_the_matching_model_and_weighs_more(')
          tests.write_text(text[:start] + 'def test_kaz_1_1_uses_only_the_low_effort_model(\n    groq_url: str, make_env: Callable[..., Env]\n) -> None:\n    env = make_env(provider(groq_url))\n    with env.client() as client:\n        env.signed_in(client, "ana@example.com")\n        stream = send(client, "pergunta leve", effort="baixo")\n        assert stream[-1]["reply"]["content"] == "resposta de small-model"\n        # O raciocínio cru nunca chegou à tela.\n        assert "segredo do raciocínio" not in json.dumps(stream)\n')
          PY
      - name: Commit the change
        run: |
          git config user.name "Jean Vicence"
          git config user.email "jeanvicence@gmail.com"
          git add kazer/brain/model_provider.py tests/test_groq.py
          git rm .github/workflows/apply-kaz-low-effort.yml
          git commit -m "fix: limit KAZ 1.1 to low effort"
          git push origin main
