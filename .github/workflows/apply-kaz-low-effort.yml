name: Apply KAZ 1.1 low effort

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-kaz-low-effort.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restrict KAZ 1.1 to Baixo
        run: |
          python - <<'PY'
          from pathlib import Path

          provider = Path("kazer/brain/model_provider.py")
          text = provider.read_text()
          old = '            capabilities=Capabilities(\n                images=bool(vision_model),\n                efforts=tuple(level for level in EFFORTS if level in self._tiers),\n            ),'
          new = '            capabilities=Capabilities(\n                images=bool(vision_model),\n                # O KAZ 1.1 público oferece somente o modo Baixo.\n                efforts=("baixo",),\n            ),'
          if old not in text:
              raise SystemExit("Trecho de capacidades do KAZ 1.1 não encontrado")
          provider.write_text(text.replace(old, new, 1))

          tests = Path("tests/test_groq.py")
          text = tests.read_text()
          replacements = [
              ('    assert built.capabilities.efforts == ("baixo", "medio", "alto", "extra", "max")', '    assert built.capabilities.efforts == ("baixo",)'),
              ('        assert [e["id"] for e in config["efforts"]] == ["baixo", "medio", "alto", "max"]\n\n        # Esforço fora da oferta é recusado no servidor, não só escondido.\n        bad = client.post(\n            "/api/chat", json={"client_id": "abcdefgh1", "content": "oi", "effort": "extra"}\n        )', '        assert [e["id"] for e in config["efforts"]] == ["baixo"]\n\n        # Esforço fora da oferta é recusado no servidor, não só escondido.\n        bad = client.post(\n            "/api/chat", json={"client_id": "abcdefgh1", "content": "oi", "effort": "medio"}\n        )'),
              ('def test_chosen_effort_reaches_the_matching_model_and_weighs_more(\n    groq_url: str, make_env: Callable[..., Env]\n) -> None:\n    env = make_env(provider(groq_url))\n    with env.client() as client:\n        env.signed_in(client, "ana@example.com")\n        usage_before = client.get("/api/settings").json()["usage"]["consumed"]\n        stream = send(client, "pergunta leve", effort="baixo")\n        assert stream[-1]["reply"]["content"] == "resposta de small-model"\n        light = client.get("/api/settings").json()["usage"]["consumed"] - usage_before\n\n        mid = client.get("/api/settings").json()["usage"]["consumed"]\n        stream = send(client, "pergunta pesada", effort="max")\n        assert stream[-1]["reply"]["content"] == "resposta de huge-model"\n        heavy = client.get("/api/settings").json()["usage"]["consumed"] - mid\n        assert heavy > light, (light, heavy)\n        # O raciocínio cru nunca chegou à tela.\n        assert "segredo do raciocínio" not in json.dumps(stream)', 'def test_kaz_1_1_uses_only_the_low_effort_model(\n    groq_url: str, make_env: Callable[..., Env]\n) -> None:\n    env = make_env(provider(groq_url))\n    with env.client() as client:\n        env.signed_in(client, "ana@example.com")\n        stream = send(client, "pergunta leve", effort="baixo")\n        assert stream[-1]["reply"]["content"] == "resposta de small-model"\n        # O raciocínio cru nunca chegou à tela.\n        assert "segredo do raciocínio" not in json.dumps(stream)'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit("Teste esperado não encontrado")
              text = text.replace(old, new, 1)
          tests.write_text(text)
          PY
      - name: Validate
        run: python -m pytest tests/test_groq.py tests/test_chat.py
      - name: Commit the change
        run: |
          git config user.name "Jean Vicence"
          git config user.email "jeanvicence@gmail.com"
          git add kazer/brain/model_provider.py tests/test_groq.py
          git rm .github/workflows/apply-kaz-low-effort.yml
          git commit -m "fix: limit KAZ 1.1 to low effort"
          git push origin main
