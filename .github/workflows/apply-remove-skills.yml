name: Apply Skills removal

on:
  push:
    branches:
      - work/remove-skills
    paths:
      - ".apply-remove-skills/**"
      - ".github/workflows/apply-remove-skills.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat .apply-remove-skills/part* | base64 -d | gzip -d | git apply
          rm -rf .apply-remove-skills .github/workflows/apply-remove-skills.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove Skills feature"
          git push