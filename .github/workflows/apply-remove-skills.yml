$name: Apply Skills removal\non:\n  push:\n    branches: [work/remove-skills]\n    paths: [.apply-remove-skills/**, .github/workflows/apply-remove-skills.yml]\npermissions:\n  contents: write\njobs:\n  apply:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: |\n          cat .apply-remove-skills/part* | base64 -d | gzip -d | git apply\n          rm -rf .apply-remove-skills .github/workflows/apply-remove-skills.yml\n          git config user.name github-actions[bot]\n          git config user.email 41898282+github-actions[bot]@users.noreply.github.com\n          git add -A\n          git commit -m "Remove Skills feature"\n          git push